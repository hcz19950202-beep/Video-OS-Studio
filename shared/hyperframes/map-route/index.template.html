<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; font-family: Arial, sans-serif; color: #F5F7FA; overflow: hidden; }
      [data-composition-id] { width: 100%; height: 100%; background: transparent; }
      .scene-content { width: 100%; height: 100%; padding: 10%; display: flex; flex-direction: column; justify-content: center; gap: 7%; }
      .kicker { font-size: 4vmin; font-weight: 900; letter-spacing: .16em; color: var(--accent); animation: hf-label-in .45s cubic-bezier(.22,1,.36,1) both paused; }
      .metric { font-size: 11vmin; font-weight: 950; line-height: .9; animation: hf-days-in .55s cubic-bezier(.22,1,.36,1) .12s both paused; }
      .route { position: relative; height: 22vmin; display: flex; align-items: center; justify-content: space-between; }
      .line { position: absolute; left: 5%; right: 5%; top: 50%; height: 1vmin; border-radius: 999px; background: rgba(245,247,250,.16); }
      .line-fill { height: 100%; width: 100%; border-radius: 999px; background: var(--accent); transform-origin: left center; animation: hf-line-in 1.3s ease-in-out .48s both paused; }
      .point { z-index: 4; display: flex; align-items: center; justify-content: center; width: 9vmin; height: 9vmin; border-radius: 50%; background: #111820; border: .7vmin solid var(--accent); font-size: 2.2vmin; font-weight: 900; animation: hf-point-in .4s cubic-bezier(.34,1.56,.64,1) both paused; }
      .point:nth-of-type(3) { animation-delay: .30s; }
      .point:nth-of-type(4) { animation-delay: .46s; }
      .marker { position: absolute; z-index: 3; top: 50%; left: 5%; width: 4vmin; height: 4vmin; margin-top: -2vmin; margin-left: -2vmin; border-radius: 50%; background: #F5F7FA; box-shadow: 0 0 3vmin var(--accent); animation: hf-marker-travel 1.3s ease-in-out .48s both paused; }
      .labels { display: flex; justify-content: space-between; font-size: 4.2vmin; font-weight: 900; }
      .labels span { animation: hf-labels-in .38s ease-out both paused; }
      .labels span:first-child { animation-delay: .42s; }
      .labels span:last-child { animation-delay: .54s; }
      @keyframes hf-label-in { from { opacity: 0; transform: translateY(35px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes hf-days-in { from { opacity: 0; transform: translateY(55px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes hf-point-in { from { opacity: 0; transform: scale(.65); } to { opacity: 1; transform: scale(1); } }
      @keyframes hf-labels-in { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes hf-line-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
      @keyframes hf-marker-travel { from { left: 5%; } to { left: 95%; } }
    </style>
  </head>
  <body>
    <div id="composition" data-composition-id="map-route" data-no-timeline data-start="0" data-duration="__DURATION__" data-track-index="0" data-width="__WIDTH__" data-height="__HEIGHT__">
      <div class="scene-content">
        <div class="kicker" id="label"></div>
        <div class="metric" id="days"></div>
        <div class="route">
          <div class="line"><div class="line-fill"></div></div>
          <div class="marker"></div>
          <div class="point">A</div>
          <div class="point">B</div>
        </div>
        <div class="labels"><span id="from"></span><span id="to"></span></div>
      </div>
    </div>
    <script>
      const raw = Uint8Array.from(atob("__PROPS_B64__"), (c) => c.charCodeAt(0));
      const p = JSON.parse(new TextDecoder().decode(raw));
      document.documentElement.style.setProperty("--accent", p.accentColor || "#FFC400");
      document.getElementById("label").textContent = p.label;
      document.getElementById("days").textContent = p.days;
      document.getElementById("from").textContent = p.from;
      document.getElementById("to").textContent = p.to;
    </script>
  </body>
</html>
