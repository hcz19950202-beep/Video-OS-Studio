<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; background: transparent; font-family: Arial, sans-serif; color: #F5F7FA; overflow: hidden; }
      [data-composition-id] { width: 100%; height: 100%; background: transparent; }
      .scene-content { width: 100%; height: 100%; padding: 9%; display: flex; flex-direction: column; justify-content: center; gap: 7%; }
      .kicker { font-size: 4.2vmin; font-weight: 900; letter-spacing: .16em; color: var(--accent); animation: hf-title-in .5s cubic-bezier(.22,1,.36,1) both paused; }
      .steps { display: flex; align-items: center; gap: 2.5%; width: 100%; }
      .step { flex: 1; min-height: 18vmin; border: 2px solid rgba(245,247,250,.18); border-radius: 2.2vmin; background: rgba(17,24,32,.92); display: flex; align-items: center; justify-content: center; padding: 2.5%; font-size: 4.2vmin; font-weight: 900; text-align: center; animation: hf-step-in .5s cubic-bezier(.22,1,.36,1) both paused; }
      #s1 { animation-delay: .18s; }
      #s2 { animation-delay: .30s; }
      #s3 { animation-delay: .42s; }
      #s4 { animation-delay: .54s; }
      .arrow { font-size: 4.8vmin; color: var(--accent); font-weight: 900; animation: hf-arrow-in .35s ease-out both paused; }
      .arrow:nth-child(2) { animation-delay: .42s; }
      .arrow:nth-child(4) { animation-delay: .54s; }
      .arrow:nth-child(6) { animation-delay: .66s; }
      .rail { height: 1.2vmin; background: rgba(245,247,250,.14); border-radius: 999px; overflow: hidden; }
      .fill { height: 100%; width: 100%; background: var(--accent); transform-origin: left center; animation: hf-fill-in 1.1s ease-in-out .55s both paused; }
      @keyframes hf-title-in { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes hf-step-in { from { opacity: 0; transform: translateY(55px) scale(.94); } to { opacity: 1; transform: translateY(0) scale(1); } }
      @keyframes hf-arrow-in { from { opacity: 0; transform: translateX(-18px); } to { opacity: 1; transform: translateX(0); } }
      @keyframes hf-fill-in { from { transform: scaleX(0); } to { transform: scaleX(1); } }
    </style>
  </head>
  <body>
    <div id="composition" data-composition-id="process-flow" data-start="0" data-duration="__DURATION__" data-track-index="0" data-width="__WIDTH__" data-height="__HEIGHT__">
      <div class="scene-content">
        <div class="kicker" id="title">HOW IT WORKS</div>
        <div class="steps">
          <div class="step" id="s1"></div><div class="arrow">→</div><div class="step" id="s2"></div><div class="arrow">→</div><div class="step" id="s3"></div><div class="arrow">→</div><div class="step" id="s4"></div>
        </div>
        <div class="rail"><div class="fill"></div></div>
      </div>
    </div>
    <script>
      const raw = Uint8Array.from(atob("__PROPS_B64__"), (c) => c.charCodeAt(0));
      const p = JSON.parse(new TextDecoder().decode(raw));
      document.documentElement.style.setProperty("--accent", p.accentColor || "#FFC400");
      document.getElementById("title").textContent = p.title;
      ["s1", "s2", "s3", "s4"].forEach((id, i) => {
        const node = document.getElementById(id);
        node.textContent = p.steps[i] || "";
        node.style.opacity = p.steps[i] ? "1" : ".18";
      });
    </script>
  </body>
</html>
