name: V2.5.1 Runtime Owner File Isolation

on:
  push:
    branches:
      - release/v2.5.1-mcp-correctness
    paths:
      - .github/workflows/v2-5-1-runtime-owner-file-isolation.yml

jobs:
  isolate-server-runtime-tests:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Discover server-runtime touching tests
        shell: pwsh
        run: |
          $patterns = @(
            '@/lib/server/mcp-runtime',
            '@/lib/server/agent-runtime',
            '@/lib/server/runtime',
            '@/app/api/',
            '../app/api/',
            './app/api/'
          )
          $files = Get-ChildItem tests -Recurse -Filter '*.test.ts' | Where-Object {
            $text = Get-Content -Raw $_.FullName
            $matched = $false
            foreach ($pattern in $patterns) { if ($text.Contains($pattern)) { $matched = $true; break } }
            $matched
          } | ForEach-Object { $_.FullName.Substring($env:GITHUB_WORKSPACE.Length + 1).Replace('\','/') } | Sort-Object -Unique
          Write-Host "DISCOVERED_COUNT=$($files.Count)"
          $files | ForEach-Object { Write-Host "DISCOVERED=$_" }
          $files -join "`n" | Set-Content -NoNewline "$env:RUNNER_TEMP\runtime-tests.txt"
      - name: Run each test file in an isolated fork and inspect residue
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $files = @(Get-Content "$env:RUNNER_TEMP\runtime-tests.txt" | Where-Object { $_.Trim() })
          if ($files.Count -eq 0) { throw 'No server-runtime touching tests discovered.' }
          $failures = @()
          $residueOwners = @()
          $index = 0
          foreach ($file in $files) {
            $index++
            $slug = [IO.Path]::GetFileNameWithoutExtension($file) -replace '[^A-Za-z0-9._-]','-'
            $root = Join-Path $env:RUNNER_TEMP ("runtime-file-isolation-{0:D3}-{1}" -f $index,$slug)
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $env:VIDEO_OS_DATA_ROOT = Join-Path $root 'data'
            $env:TEMP = Join-Path $root 'temp'
            $env:TMP = $env:TEMP
            New-Item -ItemType Directory -Force -Path $env:VIDEO_OS_DATA_ROOT,$env:TEMP | Out-Null
            Write-Host "=== FILE_BEGIN $file ==="
            & npx vitest run $file --pool=forks --maxWorkers=1 --minWorkers=1
            $exit = $LASTEXITCODE
            Write-Host "FILE_EXIT=$exit"
            if ($exit -ne 0) { $failures += $file }
            $lock = Join-Path $env:VIDEO_OS_DATA_ROOT '.runtime-owner.lock'
            $owner = Join-Path $env:VIDEO_OS_DATA_ROOT '.runtime-owner.json'
            if (Test-Path $owner) {
              Write-Host "OWNER_JSON_PRESENT=YES"
              Write-Host (Get-Content -Raw $owner)
            } else { Write-Host "OWNER_JSON_PRESENT=NO" }
            if (Test-Path $lock) {
              $raw = Get-Content -Raw $lock
              Write-Host "RUNTIME_OWNER_LOCK_PRESENT=YES"
              Write-Host "LOCK_RAW=$raw"
              try {
                $record = $raw | ConvertFrom-Json
                $pidValue = [int]$record.pid
                $alive = [bool](Get-Process -Id $pidValue -ErrorAction SilentlyContinue)
                Write-Host "LOCK_PID=$pidValue"
                Write-Host "LOCK_OWNER_ALIVE=$alive"
                Write-Host "LOCK_CREATED_AT=$($record.createdAt)"
              } catch { Write-Host "LOCK_PARSE_ERROR=$($_.Exception.Message)" }
              $residueOwners += $file
            } else { Write-Host "RUNTIME_OWNER_LOCK_PRESENT=NO" }
            Write-Host "=== FILE_END $file ==="
          }
          Write-Host "TEST_FAILURE_COUNT=$($failures.Count)"
          $failures | ForEach-Object { Write-Host "TEST_FAILURE=$_" }
          Write-Host "RESIDUE_FILE_COUNT=$($residueOwners.Count)"
          $residueOwners | ForEach-Object { Write-Host "RESIDUE_FILE=$_" }
          if ($failures.Count -gt 0 -or $residueOwners.Count -gt 0) {
            throw "File-isolation diagnostic found failures or runtime-owner residue."
          }
