name: V2.4.3 P3 Hardening Patch

on:
  push:
    branches:
      - fix/v2.4.3-p3-hardening

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: npm ci

      - name: Prove regressions fail before patch
        shell: bash
        run: |
          if npx vitest run tests/v2.4.3-p3-hardening.test.ts; then
            echo "Expected P3 regression tests to fail before the patch, but they passed."
            exit 1
          fi

      - name: Apply narrow P3 hardening patch
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              file = Path(path)
              text = file.read_text(encoding="utf-8")
              if text.count(old) != 1:
                  raise SystemExit(f"Expected exactly one anchor in {path}: {old!r}; found {text.count(old)}")
              file.write_text(text.replace(old, new, 1), encoding="utf-8")

          response_body = Path("lib/ai/providers/response-body.ts")
          text = response_body.read_text(encoding="utf-8")
          anchor = '''export const cancelProviderResponseBody=async(response:Response)=>{\n  try{await response.body?.cancel();}catch{return;}\n};\n'''
          addition = anchor + '''\nexport const cancelProviderStreamReader=async(reader:ReadableStreamDefaultReader<Uint8Array>)=>{\n  try{await reader.cancel();}catch{return;}\n};\n'''
          if text.count(anchor) != 1:
              raise SystemExit("response-body helper anchor drifted")
          response_body.write_text(text.replace(anchor, addition, 1), encoding="utf-8")

          replace_once(
              "lib/ai/providers/openai-responses.ts",
              'import {cancelProviderResponseBody} from "@/lib/ai/providers/response-body";',
              'import {cancelProviderResponseBody,cancelProviderStreamReader} from "@/lib/ai/providers/response-body";',
          )
          replace_once(
              "lib/ai/providers/deepseek-chat.ts",
              'import {cancelProviderResponseBody} from "@/lib/ai/providers/response-body";',
              'import {cancelProviderResponseBody,cancelProviderStreamReader} from "@/lib/ai/providers/response-body";',
          )
          replace_once(
              "lib/ai/providers/volcengine-agent-plan.ts",
              'import {ProviderResponseTooLargeError,cancelProviderResponseBody,readProviderResponseTextBounded} from "@/lib/ai/providers/response-body";',
              'import {ProviderResponseTooLargeError,cancelProviderResponseBody,cancelProviderStreamReader,readProviderResponseTextBounded} from "@/lib/ai/providers/response-body";',
          )

          finally_anchor = '''  }finally{\n    reader.releaseLock();\n  }\n'''
          finally_replacement = '''  }finally{\n    await cancelProviderStreamReader(reader);\n    reader.releaseLock();\n  }\n'''
          for provider_path in [
              "lib/ai/providers/openai-responses.ts",
              "lib/ai/providers/deepseek-chat.ts",
              "lib/ai/providers/volcengine-agent-plan.ts",
          ]:
              replace_once(provider_path, finally_anchor, finally_replacement)

          runner = Path("lib/workflows/runner.ts")
          runner_text = runner.read_text(encoding="utf-8")
          catch_anchor = '}catch(error){await this.failStage(run.id,stage,error);}'
          if runner_text.count(catch_anchor) != 2:
              raise SystemExit(f"Expected two Workflow catch anchors; found {runner_text.count(catch_anchor)}")
          runner_text = runner_text.replace(catch_anchor, '}catch(error){await this.failStagePreservingError(run.id,stage,error);}')
          method_anchor = '''\n  private async cancelUnattachedJob(jobId:string){if(!this.jobs)return;try{await this.jobs.cancel(jobId);}catch{return;}}\n'''
          method = '''\n  private async failStagePreservingError(workflowId:string,stage:WorkflowStageDefinition,error:unknown){\n    try{await this.failStage(workflowId,stage,error);}\n    catch(recordingError){throw new AggregateError([error,recordingError],`Workflow stage ${stage.id} failed and failure recording also failed.`);}\n  }\n\n  private async cancelUnattachedJob(jobId:string){if(!this.jobs)return;try{await this.jobs.cancel(jobId);}catch{return;}}\n'''
          if runner_text.count(method_anchor) != 1:
              raise SystemExit("Workflow helper insertion anchor drifted")
          runner.write_text(runner_text.replace(method_anchor, method, 1), encoding="utf-8")

      - name: Verify targeted hardening regressions
        run: npx vitest run tests/v2.4.3-p3-hardening.test.ts tests/ai-openai-responses-provider.test.ts tests/ai-deepseek-chat-provider.test.ts tests/ai-volcengine-agent-plan-provider.test.ts tests/workflow-runtime.test.ts

      - name: Typecheck
        run: npm run typecheck

      - name: Commit verified patch and remove one-shot workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v2-4-3-p3-hardening-patch.yml
          git add lib/ai/providers/response-body.ts \
                  lib/ai/providers/openai-responses.ts \
                  lib/ai/providers/deepseek-chat.ts \
                  lib/ai/providers/volcengine-agent-plan.ts \
                  lib/workflows/runner.ts \
                  tests/v2.4.3-p3-hardening.test.ts
          git commit -m "fix(v2.4.3): harden provider cleanup and workflow errors"
          git push origin HEAD:fix/v2.4.3-p3-hardening
