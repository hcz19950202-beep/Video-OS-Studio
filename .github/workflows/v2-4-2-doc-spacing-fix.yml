name: V2.4.2 Docs Spacing Fix

on:
  push:
    branches:
      - docs/v2.4.2-release-truth
    paths:
      - .github/workflows/v2-4-2-doc-spacing-fix.yml

permissions:
  contents: write

jobs:
  normalize-spacing:
    runs-on: ubuntu-latest
    env:
      EXPECTED_DOCS_HEAD: fe666f98844ee627ae4996324876edf6c71c4a47
      RELEASE_COMMIT: 79e48b068f701bba3f1c826710337a82f0a64760
      TAG_OBJECT_SHA: 2c9b0ca2401f547066c6a51ff0ec60a641cfce35
    steps:
      - name: Checkout exact docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/v2.4.2-release-truth
          fetch-depth: 0

      - name: Verify frozen parent and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD^)" = "$EXPECTED_DOCS_HEAD"
          test "$(git cat-file -t v2.4.2)" = "tag"
          test "$(git rev-parse v2.4.2)" = "$TAG_OBJECT_SHA"
          test "$(git rev-parse 'v2.4.2^{}')" = "$RELEASE_COMMIT"

      - name: Normalize Markdown section spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixes = {
              Path("PROJECT_STATUS.md"): [
                  (
                      "before immutable tagging.\n## Immutable V2.4.1 release truth",
                      "before immutable tagging.\n\n## Immutable V2.4.1 release truth",
                  ),
              ],
              Path("README.md"): [
                  (
                      "`v2.4.0` and `v2.4.1` were independently reverified and remain unchanged.\n## V2.4.1 release verification",
                      "`v2.4.0` and `v2.4.1` were independently reverified and remain unchanged.\n\n## V2.4.1 release verification",
                  ),
              ],
              Path("docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md"): [
                  (
                      "v2.4.0 target:       da22a5415cbf8ad2a9ce93b912b41b787b29a9b1\n```\n## Release contract",
                      "v2.4.0 target:       da22a5415cbf8ad2a9ce93b912b41b787b29a9b1\n```\n\n## Release contract",
                  ),
              ],
          }

          for path, replacements in fixes.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  assert old in text, f"expected spacing target missing in {path}"
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check

      - name: Commit spacing fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only | sort | paste -sd ',' -)" = "PROJECT_STATUS.md,README.md,docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md
          git rm .github/workflows/v2-4-2-doc-spacing-fix.yml
          git commit -m "docs(v2.4.2): normalize release truth spacing"
          git push origin HEAD:docs/v2.4.2-release-truth
