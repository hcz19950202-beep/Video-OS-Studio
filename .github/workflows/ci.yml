name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format-h6-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout H6 branch
        uses: actions/checkout@v4
        with:
          ref: hardening/v2.1.1-h6-automated-acceptance
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format H6 acceptance files
        run: npm run format
      - name: Commit exact Prettier output
        shell: bash
        run: |
          git add tests/e2e/h6-smoke.spec.ts tests/h6/windows-media-smoke.test.ts
          if git diff --cached --quiet; then
            echo "H6 acceptance files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style: format H6 acceptance tests"
          git push origin HEAD:hardening/v2.1.1-h6-automated-acceptance
      - name: Stop temporary formatter workflow
        run: exit 1
