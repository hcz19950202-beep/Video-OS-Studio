name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Bootstrap exact B6 harness formatting
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          npm run format
          if git diff --quiet -- tests/h6/windows-b6-core-acceptance.test.ts; then
            echo "B6 harness already matches pinned Prettier 3.8.1."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add tests/h6/windows-b6-core-acceptance.test.ts
            git commit -m "style(v2.4-b6): apply pinned prettier to windows harness"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test

  browser-smoke:
    needs: ubuntu-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure isolated browser data root
        shell: bash
        run: |
          echo "CI=true" >> "$GITHUB_ENV"
          echo "VIDEO_OS_DATA_ROOT=$RUNNER_TEMP/video-os-h6-e2e" >> "$GITHUB_ENV"
      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Playwright H6 smoke
        run: npm run test:e2e

  windows-media-smoke:
    needs: windows-verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact-SHA checkout mismatch." }
          "B4_REAL_MEDIA_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure isolated Windows media root
        shell: pwsh
        run: |
          "H6_WINDOWS_MEDIA_SMOKE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDEO_OS_DATA_ROOT=$env:RUNNER_TEMP\video-os-h6-windows-media" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress
      - name: Verify media runtime
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chrome)) { throw "Chrome executable not found at $chrome" }
      - name: Windows exact-SHA real-media + B4 QA smoke
        run: npm run test:windows-media

  windows-b6-core-acceptance:
    needs: windows-verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact-SHA checkout mismatch." }
          "B6_EXPECTED_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress
      - name: Create encoded B6 source fixture
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP\b6-source.mp4"
          ffmpeg -y -f lavfi -i "testsrc2=size=640x360:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 6.2 -c:v libx264 -pix_fmt yuv420p -c:a aac $source
          if (!(Test-Path $source)) { throw "B6 encoded source fixture was not created." }
          "B6_WINDOWS_CORE_ACCEPTANCE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "B6_SOURCE_VIDEO=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "B6_DATA_ROOT=$env:RUNNER_TEMP\video-os-b6-core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify B6 media runtime
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chrome)) { throw "Chrome executable not found at $chrome" }
      - name: Windows exact-SHA B6 real-engine acceptance
        run: npm run test:windows-b6
