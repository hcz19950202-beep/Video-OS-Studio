name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ubuntu-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build

  windows-verify:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Format check
        run: npm run format:check
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test -- --maxWorkers=2

  browser-smoke:
    needs: ubuntu-verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure isolated browser data root
        shell: bash
        run: |
          echo "CI=true" >> "$GITHUB_ENV"
          echo "VIDEO_OS_DATA_ROOT=$RUNNER_TEMP/video-os-h6-e2e" >> "$GITHUB_ENV"
      - name: Install pinned Chromium
        run: npx --no-install playwright install --with-deps chromium
      - name: Playwright H6 smoke
        run: npm run test:e2e

  windows-media-smoke:
    needs: windows-verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact-SHA checkout mismatch." }
          "B4_REAL_MEDIA_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Configure isolated Windows media root
        shell: pwsh
        run: |
          "H6_WINDOWS_MEDIA_SMOKE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDEO_OS_DATA_ROOT=$env:RUNNER_TEMP\video-os-h6-windows-media" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install pinned FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress
      - name: Verify media runtime
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chrome)) { throw "Chrome executable not found at $chrome" }
      - name: Windows exact-SHA real-media + B4 QA smoke
        run: npm run test:windows-media

  windows-hyperframes-smoke:
    needs: windows-verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact-SHA checkout mismatch." }
          "H0_WINDOWS_HYPERFRAMES_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "H0_WINDOWS_HYPERFRAMES_SMOKE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HYPERFRAMES_NO_UPDATE_CHECK=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "HYPERFRAMES_NO_TELEMETRY=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress
      - name: HyperFrames diagnostics
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
          npx --no-install hyperframes browser ensure
          npx --no-install hyperframes browser path
          npx --no-install hyperframes doctor --json
      - name: Windows exact-SHA HyperFrames real render
        run: npm run test:windows-hyperframes

  windows-b6-core-acceptance:
    needs: windows-verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact-SHA checkout mismatch." }
          "B6_EXPECTED_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress
      - name: Create encoded B6 source fixture
        shell: pwsh
        run: |
          $source = "$env:RUNNER_TEMP\b6-source.mp4"
          ffmpeg -y -f lavfi -i "testsrc2=size=640x360:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 6.2 -c:v libx264 -pix_fmt yuv420p -c:a aac $source
          if (!(Test-Path $source)) { throw "B6 encoded source fixture was not created." }
          "B6_WINDOWS_CORE_ACCEPTANCE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "B6_SOURCE_VIDEO=$source" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "B6_DATA_ROOT=$env:RUNNER_TEMP\video-os-b6-core" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify B6 media runtime
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chrome)) { throw "Chrome executable not found at $chrome" }
      - name: Windows exact-SHA B6 real-engine acceptance
        run: npm run test:windows-b6

  windows-b7-campaign-acceptance:
    needs: windows-verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout exact tested SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact source SHA
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          $actual = (git rev-parse HEAD).Trim()
          if ($actual -ne $env:EXPECTED_SHA) { throw "Exact-SHA checkout mismatch." }
          "B7_EXPECTED_SHA=$actual" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install pinned FFmpeg
        shell: pwsh
        run: choco install ffmpeg --version=9.0.1 -y --no-progress
      - name: Create encoded B7 source fixtures
        shell: pwsh
        run: |
          $sourceA = "$env:RUNNER_TEMP\b7-source-a-gapped.mp4"
          $sourceB = "$env:RUNNER_TEMP\b7-source-b.mp4"
          ffmpeg -y -f lavfi -i "testsrc2=size=640x360:rate=30:duration=6" -f lavfi -i "sine=frequency=440:sample_rate=48000:duration=6" -vf "select='not(between(t,1,4))'" -fps_mode vfr -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest $sourceA
          ffmpeg -y -f lavfi -i "smptebars=size=640x360:rate=30" -f lavfi -i "sine=frequency=660:sample_rate=48000" -t 4.2 -c:v libx264 -pix_fmt yuv420p -c:a aac $sourceB
          if (!(Test-Path $sourceA) -or !(Test-Path $sourceB)) { throw "B7 encoded source fixtures were not created." }

          $frameTimes = @(
            ffprobe -v error -select_streams v:0 -show_entries frame=best_effort_timestamp_time -of default=noprint_wrappers=1:nokey=1 $sourceA |
              Where-Object { $_.Trim() } |
              ForEach-Object { [double]::Parse($_.Trim(), [Globalization.CultureInfo]::InvariantCulture) }
          )
          $gapFrames = @($frameTimes | Where-Object { $_ -gt 1.05 -and $_ -lt 3.95 })
          $beforeGap = @($frameTimes | Where-Object { $_ -ge 0.9 -and $_ -le 1.05 })
          $afterGap = @($frameTimes | Where-Object { $_ -ge 3.95 -and $_ -le 4.2 })
          if ($gapFrames.Count -ne 0 -or $beforeGap.Count -eq 0 -or $afterGap.Count -eq 0) { throw "B7 source A did not preserve the required 1s-4s video timestamp gap." }

          "B7_WINDOWS_CAMPAIGN_ACCEPTANCE=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "B7_SOURCE_VIDEOS=$sourceA;$sourceB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "B7_DATA_ROOT=$env:RUNNER_TEMP\video-os-b7-campaign" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Verify B7 media runtime
        shell: pwsh
        run: |
          ffmpeg -version
          ffprobe -version
          $chrome = "C:\Program Files\Google\Chrome\Application\chrome.exe"
          if (!(Test-Path $chrome)) { throw "Chrome executable not found at $chrome" }
      - name: Windows exact-SHA B7 real-batch acceptance
        run: npm run test:windows-b7
