name: V2.5.1 Final Audit Lazy Init Fix

on:
  push:
    branches:
      - release/v2.5.1-mcp-correctness
    paths:
      - .github/workflows/v2-5-1-final-audit-lazy-init-fix.yml

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact helper branch tip
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git rev-parse origin/release/v2.5.1-mcp-correctness)" = "${GITHUB_SHA}"

      - name: Make runtime lifecycle explicit in final-audit regression
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path=Path("tests/v2.4-final-audit-runtime-lifecycle.test.ts")
          text=path.read_text(encoding="utf-8")
          old='''    const runtimeA=new DurableJobRuntime(storeA,{"render-final":executorA});\n    await preparingReached;\n'''
          new='''    const runtimeA=new DurableJobRuntime(storeA,{"render-final":executorA});\n    await runtimeA.waitUntilReady();\n    await preparingReached;\n'''
          assert text.count(old)==1, "unexpected runtimeA startup shape"
          text=text.replace(old,new,1)
          path.write_text(text,encoding="utf-8")
          PY

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format check
        run: npm run format:check

      - name: Final audit runtime lifecycle regression
        run: npx vitest run tests/v2.4-final-audit-runtime-lifecycle.test.ts

      - name: Durable runtime regression
        run: npx vitest run tests/durable-jobs-h3.test.ts

      - name: Remove helper and verify bounded diff
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-5-1-final-audit-lazy-init-fix.yml
          git diff --check
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected="$(printf '%s\n' .github/workflows/v2-5-1-final-audit-lazy-init-fix.yml tests/v2.4-final-audit-runtime-lifecycle.test.ts | sort)"
          test "$changed" = "$expected"

      - name: Commit and push exact test correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/v2.4-final-audit-runtime-lifecycle.test.ts .github/workflows/v2-5-1-final-audit-lazy-init-fix.yml
          git commit -m "test(v2.5.1): make durable runtime startup explicit"
          git push --force-with-lease=refs/heads/release/v2.5.1-mcp-correctness:${GITHUB_SHA} origin HEAD:refs/heads/release/v2.5.1-mcp-correctness
