name: V2.4.2 B6 fixture fix

on:
  push:
    branches:
      - fix/v2.4.2-correctness-liveness

permissions:
  contents: write

jobs:
  patch-b6-fixture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.4.2-correctness-liveness
          fetch-depth: 0
      - name: Add exact repair target ownership to Windows B6 fixture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/h6/windows-b6-core-acceptance.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const marker = 'B6 acceptance source video is explicitly AI-owned for bounded QA timing repair.';
          if (source.includes(marker)) process.exit(0);
          const oldBlock = `      await protection.markAiOwned(
                projectId,
                { kind: "canvas" },
                baseRevision,
                "B6 acceptance allows the bounded QA timing repair.",
              );`;
          const normalizedOldBlock = `      await protection.markAiOwned(
                projectId,
                { kind: "canvas" },
                baseRevision,
                "B6 acceptance allows the bounded QA timing repair.",
              );`;
          const actualOldBlock = [
            '      await protection.markAiOwned(',
            '        projectId,',
            '        { kind: "canvas" },',
            '        baseRevision,',
            '        "B6 acceptance allows the bounded QA timing repair.",',
            '      );',
          ].join('\n');
          const replacement = [
            actualOldBlock,
            '      await protection.markAiOwned(',
            '        projectId,',
            '        { kind: "clip", id: "b6-source-video" },',
            '        baseRevision,',
            '        "B6 acceptance source video is explicitly AI-owned for bounded QA timing repair.",',
            '      );',
            '      await protection.markAiOwned(',
            '        projectId,',
            '        { kind: "scene", id: "scene-cta" },',
            '        baseRevision,',
            '        "B6 acceptance CTA scene is explicitly AI-owned for bounded QA timing repair.",',
            '      );',
          ].join('\n');
          if (!source.includes(actualOldBlock)) {
            throw new Error('Expected Windows B6 protection fixture block was not found.');
          }
          fs.writeFileSync(path, source.replace(actualOldBlock, replacement));
          NODE
      - name: Commit targeted fixture correction
        shell: bash
        run: |
          if git diff --quiet -- tests/h6/windows-b6-core-acceptance.test.ts; then
            echo "Fixture already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/h6/windows-b6-core-acceptance.test.ts
          git commit -m "test(v2.4.2): align B6 repair ownership fixture"
          git push origin HEAD:fix/v2.4.2-correctness-liveness
