name: V2.5.2 Provider Acceptance Correction

on:
  push:
    branches:
      - feature/v2.5.2-agent-provider-routing
    paths:
      - .github/workflows/v2-5-2-provider-acceptance-fix.yml

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    env:
      EXPECTED_PARENT: b0b1b2ae14e11fe645654e2b5ea4f190b3aae301
      BRANCH: feature/v2.5.2-agent-provider-routing
    steps:
      - name: Checkout correction commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify guarded parent
        shell: bash
        run: |
          set -euo pipefail
          actual_parent="$(git rev-parse HEAD^)"
          test "$actual_parent" = "$EXPECTED_PARENT"

      - name: Apply exact compatibility corrections
        shell: python
        run: |
          from pathlib import Path

          surface = Path("components/studio/AgentConversationSurface.tsx")
          text = surface.read_text(encoding="utf-8")
          old = '<em>{provider?.configured?`${provider.label} · ${provider.model}`:provider?`${provider.label} · ${zh?"不可用":"unavailable"}`:zh?"Agent Provider 未就绪":"Agent provider unavailable"}</em>'
          new = '<em>{provider?.configured?`${provider.providerId} · ${provider.model}`:provider?`${provider.providerId} · ${zh?"不可用":"unavailable"}`:zh?"Agent Provider 未就绪":"Agent provider unavailable"}</em>'
          if text.count(old) != 1:
              raise SystemExit("surface diagnostic replacement did not match exactly once")
          surface.write_text(text.replace(old, new), encoding="utf-8")

          spec = Path("tests/e2e/v2-5-c2-unified-conversation.spec.ts")
          text = spec.read_text(encoding="utf-8")
          old = '  await expect(provider).toHaveValue("volcengine-agent-plan");\n  await expect(model).toHaveValue("ark-code-latest");'
          new = '  await expect(provider).not.toHaveValue("");\n  await expect(model).not.toHaveValue("");'
          if text.count(old) != 1:
              raise SystemExit("C2 environment-independent assertion replacement did not match exactly once")
          spec.write_text(text.replace(old, new), encoding="utf-8")

      - name: Remove one-shot workflow and verify net scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-5-2-provider-acceptance-fix.yml
          mapfile -t changed < <(git diff --name-only "$EXPECTED_PARENT" --)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "components/studio/AgentConversationSurface.tsx"
          test "${changed[1]}" = "tests/e2e/v2-5-c2-unified-conversation.spec.ts"

      - name: Commit correction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/studio/AgentConversationSurface.tsx tests/e2e/v2-5-c2-unified-conversation.spec.ts .github/workflows/v2-5-2-provider-acceptance-fix.yml
          git commit -m "fix(v2.5.2): preserve provider diagnostics across selector rollout"
          git push origin "HEAD:refs/heads/$BRANCH"
