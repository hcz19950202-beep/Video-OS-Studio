name: V2.5.2 Release Version Sync

on:
  push:
    branches:
      - release/v2.5.2-finalization
    paths:
      - .github/workflows/v2-5-2-release-version-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    env:
      EXPECTED_BASE: dfb5c0b271742c499a62a5d273fe0df08bc1afda
      TARGET_VERSION: 2.5.2
      BRANCH: release/v2.5.2-finalization
    steps:
      - name: Checkout staged helper
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2

      - name: Verify immutable starting boundary
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          test "$(git rev-parse "$EXPECTED_BASE")" = "$EXPECTED_BASE"
          if git ls-remote --exit-code --tags origin "refs/tags/v${TARGET_VERSION}" >/dev/null 2>&1; then
            echo "v${TARGET_VERSION} already exists" >&2
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Snapshot package structures and verify starting versions
        shell: node {0}
        run: |
          const fs = require('fs');
          const crypto = require('crypto');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (pkg.version !== '2.5.1') throw new Error(`package.json started at ${pkg.version}`);
          if (lock.version !== '2.5.1') throw new Error(`package-lock root started at ${lock.version}`);
          if (lock.packages?.['']?.version !== '2.5.1') throw new Error(`lock root package started at ${lock.packages?.['']?.version}`);
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(k => [k, canonical(value[k])]));
            return value;
          };
          const pkgClone = structuredClone(pkg); delete pkgClone.version;
          const lockClone = structuredClone(lock); delete lockClone.version; delete lockClone.packages[''].version;
          const hash = value => crypto.createHash('sha256').update(JSON.stringify(canonical(value))).digest('hex');
          fs.writeFileSync(process.env.RUNNER_TEMP + '/pkg-structure.sha', hash(pkgClone));
          fs.writeFileSync(process.env.RUNNER_TEMP + '/lock-structure.sha', hash(lockClone));

      - name: Synchronize package version
        shell: bash
        run: |
          set -euo pipefail
          npm version "$TARGET_VERSION" --no-git-tag-version

      - name: Verify bounded version-only package mutation
        shell: node {0}
        run: |
          const fs = require('fs');
          const crypto = require('crypto');
          const pkg = JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if (pkg.version !== process.env.TARGET_VERSION) throw new Error('package target version mismatch');
          if (lock.version !== process.env.TARGET_VERSION) throw new Error('lock target version mismatch');
          if (lock.packages?.['']?.version !== process.env.TARGET_VERSION) throw new Error('lock root package target version mismatch');
          const canonical = (value) => {
            if (Array.isArray(value)) return value.map(canonical);
            if (value && typeof value === 'object') return Object.fromEntries(Object.keys(value).sort().map(k => [k, canonical(value[k])]));
            return value;
          };
          const pkgClone = structuredClone(pkg); delete pkgClone.version;
          const lockClone = structuredClone(lock); delete lockClone.version; delete lockClone.packages[''].version;
          const hash = value => crypto.createHash('sha256').update(JSON.stringify(canonical(value))).digest('hex');
          if (hash(pkgClone) !== fs.readFileSync(process.env.RUNNER_TEMP + '/pkg-structure.sha','utf8')) throw new Error('package structure drifted beyond version');
          if (hash(lockClone) !== fs.readFileSync(process.env.RUNNER_TEMP + '/lock-structure.sha','utf8')) throw new Error('lock structure drifted beyond allowed version fields');

      - name: Remove one-shot helper and prove net scope
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-5-2-release-version-sync.yml
          mapfile -t changed < <(git diff --name-only "$EXPECTED_BASE" --)
          printf '%s\n' "${changed[@]}"
          test "${#changed[@]}" -eq 2
          test "${changed[0]}" = "package-lock.json"
          test "${changed[1]}" = "package.json"

      - name: Commit exact version sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json .github/workflows/v2-5-2-release-version-sync.yml
          git commit -m "chore(v2.5.2): synchronize release version"
          git push origin "HEAD:refs/heads/$BRANCH"
