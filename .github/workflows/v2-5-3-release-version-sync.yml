name: V2.5.3 Release Version Sync

on:
  push:
    branches:
      - release/v2.5.3-finalization

permissions:
  contents: write

concurrency:
  group: v2-5-3-release-version-sync
  cancel-in-progress: false

jobs:
  sync-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.5.3-finalization
          fetch-depth: 3
      - name: Verify guarded starting point
        shell: bash
        run: |
          accepted="6d1f5c855b73997a8147e63f240a93b560990ba0"
          parent="$(git rev-parse HEAD^)"
          grandparent="$(git rev-parse HEAD^^ 2>/dev/null || true)"
          test "$parent" = "$accepted" || test "$grandparent" = "$accepted"
          node <<'NODE'
          const fs=require('fs');
          const pkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(pkg.version!=='2.5.2'||lock.version!=='2.5.2'||lock.packages?.['']?.version!=='2.5.2'){
            throw new Error('Starting package versions are not exactly 2.5.2');
          }
          NODE
      - name: Synchronize package version only
        shell: bash
        run: npm version 2.5.3 --no-git-tag-version --ignore-scripts
      - name: Prove package and lock structure is unchanged
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          const cp=require('child_process');
          const beforePkg=JSON.parse(cp.execFileSync('git',['show','HEAD:package.json'],{encoding:'utf8'}));
          const beforeLock=JSON.parse(cp.execFileSync('git',['show','HEAD:package-lock.json'],{encoding:'utf8'}));
          const afterPkg=JSON.parse(fs.readFileSync('package.json','utf8'));
          const afterLock=JSON.parse(fs.readFileSync('package-lock.json','utf8'));
          if(afterPkg.version!=='2.5.3'||afterLock.version!=='2.5.3'||afterLock.packages?.['']?.version!=='2.5.3'){
            throw new Error('Target versions are not exactly 2.5.3');
          }
          const stripPkg=v=>{const x=structuredClone(v);delete x.version;return x;};
          const stripLock=v=>{const x=structuredClone(v);delete x.version;if(x.packages?.[''])delete x.packages[''].version;return x;};
          if(JSON.stringify(stripPkg(beforePkg))!==JSON.stringify(stripPkg(afterPkg)))throw new Error('package.json changed beyond version');
          if(JSON.stringify(stripLock(beforeLock))!==JSON.stringify(stripLock(afterLock)))throw new Error('package-lock.json changed beyond allowed version fields');
          NODE
      - name: Self-delete helper and prove temporary worktree scope
        shell: bash
        run: |
          rm .github/workflows/v2-5-3-release-version-sync.yml
          changed="$(git status --short | awk '{print $2}' | sort)"
          expected=$'.github/workflows/v2-5-3-release-version-sync.yml\npackage-lock.json\npackage.json'
          test "$changed" = "$expected"
      - name: Commit version synchronization
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json .github/workflows/v2-5-3-release-version-sync.yml
          git commit -m 'chore(v2.5.3): synchronize release version'
          git push origin HEAD:release/v2.5.3-finalization
