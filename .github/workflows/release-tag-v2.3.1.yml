name: Create V2.3.1 Annotated Tag

on:
  push:
    branches:
      - release/v2.3.1
    paths:
      - .github/workflows/release-tag-v2.3.1.yml

permissions:
  contents: write

jobs:
  create-annotated-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release branch
        uses: actions/checkout@v4
        with:
          ref: release/v2.3.1
          fetch-depth: 0

      - name: Verify immutable release target
        shell: bash
        run: |
          set -euo pipefail
          target="6e07d1dbdd0ec4d64d022f7c821e133ddf207637"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$target"
          if git ls-remote --exit-code --tags origin "refs/tags/v2.3.1" >/dev/null 2>&1; then
            echo "v2.3.1 already exists; refusing to overwrite"
            exit 1
          fi

      - name: Create annotated immutable tag
        shell: bash
        run: |
          set -euo pipefail
          target="6e07d1dbdd0ec4d64d022f7c821e133ddf207637"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a v2.3.1 "$target" -m "Video OS Studio v2.3.1"
          test "$(git cat-file -t v2.3.1)" = "tag"
          test "$(git rev-parse 'v2.3.1^{}')" = "$target"
          git push origin refs/tags/v2.3.1:refs/tags/v2.3.1

      - name: Verify remote tag and dereference
        shell: bash
        run: |
          set -euo pipefail
          target="6e07d1dbdd0ec4d64d022f7c821e133ddf207637"
          remote_tag="$(git ls-remote --tags origin 'refs/tags/v2.3.1' | awk '{print $1}')"
          remote_commit="$(git ls-remote --tags origin 'refs/tags/v2.3.1^{}' | awk '{print $1}')"
          test -n "$remote_tag"
          test "$remote_tag" != "$target"
          test "$remote_commit" = "$target"
          echo "V231_TAG_OBJECT=$remote_tag"
          echo "V231_DEREFERENCED_COMMIT=$remote_commit"
          echo "V231_ANNOTATED_TAG=PASS"
