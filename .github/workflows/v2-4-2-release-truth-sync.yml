name: V2.4.2 Release Truth Sync

on:
  push:
    branches:
      - docs/v2.4.2-release-truth
    paths:
      - .github/workflows/v2-4-2-release-truth-sync.yml

permissions:
  contents: write

jobs:
  sync-release-truth:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: 79e48b068f701bba3f1c826710337a82f0a64760
      TAG_OBJECT_SHA: 2c9b0ca2401f547066c6a51ff0ec60a641cfce35
    steps:
      - name: Checkout isolated docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/v2.4.2-release-truth
          fetch-depth: 0

      - name: Verify immutable release truth before docs mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD^)" = "$RELEASE_COMMIT"
          test "$(git cat-file -t v2.4.2)" = "tag"
          test "$(git rev-parse v2.4.2)" = "$TAG_OBJECT_SHA"
          test "$(git rev-parse 'v2.4.2^{}')" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'v2.4.1^{}')" = "4c105bad936479690711c03f3e349db36fbadaf5"
          test "$(git rev-parse 'v2.4.0^{}')" = "da22a5415cbf8ad2a9ce93b912b41b787b29a9b1"

      - name: Update release truth documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_commit = "79e48b068f701bba3f1c826710337a82f0a64760"
          tag_object = "2c9b0ca2401f547066c6a51ff0ec60a641cfce35"

          # PROJECT_STATUS.md
          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          section = text.index("## Current checkpoint")
          start = text.index("```yaml\n", section)
          end = text.index("\n```", start) + len("\n```")
          new_yaml = f'''```yaml
          released_product_version: 2.4.2
          released_tag: v2.4.2
          released_commit: {release_commit}
          released_tag_object_sha: {tag_object}
          project_schema: 2.0.0

          package_json_version: 2.4.2
          package_lock_version: 2.4.2

          active_development_workstream: NONE
          active_stage: V2.4.2 RELEASE COMPLETE
          active_branch: NONE
          engineering_audit_pr: PR #87
          engineering_merge_pr: PR #88
          accepted_engineering_head: c3825fe42e77c4369ec6e03d89204161764667e9
          accepted_engineering_main: 8e8f63cd570af460a53199f45a139ee78c3a4dcb
          accepted_engineering_main_ci: CI #1091 / run 33333104052 / PASS
          local_windows_gate: c3825fe42e77c4369ec6e03d89204161764667e9 / PASS
          release_metadata_sync: run 33333443237 / PASS
          release_finalization_pr: PR #89
          release_pr_frozen_head: 6d72d70930f3571c84b9d3f250c140515dbbded3
          release_pr_ci: CI #1092 / run 33333581692 / PASS
          release_main_ci: CI #1093 / run 33333816771 / PASS
          release_tag_creation: run 33334882825 / PASS
          local_action_required: NO
          next_action: NONE — V2.4.2 is released; future product work requires a separately approved V2.4.x or V2.5 workstream
          v2_4_status: RELEASED
          v2_4_1_status: RELEASED
          v2_4_2_status: RELEASED
          ```'''
          # Strip indentation introduced by the workflow source.
          new_yaml = "\n".join(line.strip() if line.startswith("          ") else line for line in new_yaml.splitlines())
          text = text[:start] + new_yaml + text[end:]

          marker = "## Immutable V2.4.1 release truth"
          assert marker in text
          assert "## Immutable V2.4.2 release truth" not in text
          insert = f'''## Immutable V2.4.2 release truth

          Video OS Studio V2.4.2 is released at the independently verified annotated tag `v2.4.2`.

          ```text
          release commit:      {release_commit}
          annotated tag:       v2.4.2
          tag object SHA:      {tag_object}
          tag target type:     commit
          dereferenced target: {release_commit}
          tag message:         Video OS Studio v2.4.2
          ```

          Exact-main CI #1093 / run `33333816771` passed all seven gates on the release commit. Isolated tag creation run `33334882825` then created the immutable annotated tag only after proving `origin/main` still equaled the release commit and `v2.4.2` did not already exist. Independent GitHub Git Data verification proved `refs/tags/v2.4.2` points to object type `tag`, tag object `{tag_object}`, which targets commit `{release_commit}`.

          Immutable `v2.4.0` and `v2.4.1` were independently reverified and still target their original release commits.

          Authoritative release evidence:

          `docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md`

          ## V2.4.2 accepted patch truth

          V2.4.2 is a bounded correctness/liveness patch over V2.4.1. It adds no Project Schema migration and keeps Node, Remotion, HyperFrames, Playwright and Prettier pins frozen. The accepted engineering candidate is `c3825fe42e77c4369ec6e03d89204161764667e9`; mandatory Local Windows acceptance passed on that exact SHA, including targeted real HyperFrames recertification. PR #88 merged the exact accepted head to engineering main `8e8f63cd570af460a53199f45a139ee78c3a4dcb`, and PR #89 finalized release metadata before immutable tagging.

          '''
          insert = "\n".join(line.strip() if line.startswith("          ") else line for line in insert.splitlines())
          text = text.replace(marker, insert + marker, 1)

          history = "V2.4.1 RELEASE / PR #85 / release commit 4c105bad936479690711c03f3e349db36fbadaf5 / CI #1016 PASS / annotated tag verified"
          assert history in text
          text = text.replace(history, history + "\nV2.4.2 PATCH / PR #87 audit + PR #88 accepted merge / Local Windows PASS\nV2.4.2 RELEASE / PR #89 / release commit 79e48b068f701bba3f1c826710337a82f0a64760 / CI #1093 PASS / annotated tag verified", 1)
          path.write_text(text, encoding="utf-8")

          # README.md
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "**Video OS Studio v2.4.1 is released.**": "**Video OS Studio v2.4.2 is released.**",
              "Product version: 2.4.1": "Product version: 2.4.2",
              "Release commit: 4c105bad936479690711c03f3e349db36fbadaf5": f"Release commit: {release_commit}",
              "Release tag: v2.4.1 (annotated, verified)": "Release tag: v2.4.2 (annotated, verified)",
              "Tag object: 9f3d06d8eabb114d6f1bcd907e98b4de3756a4a7": f"Tag object: {tag_object}",
              "The annotated `v2.4.1` tag is the immutable current release boundary. Previous `v2.3.0`, `v2.3.1`, and `v2.4.0` release tags remain immutable evidence and must never be moved or recreated.": "The annotated `v2.4.2` tag is the immutable current release boundary. Previous `v2.3.0`, `v2.3.1`, `v2.4.0`, and `v2.4.1` release tags remain immutable evidence and must never be moved or recreated.",
              "[`docs/acceptance/V2_4_1_RELEASE_FINALIZATION.md`](docs/acceptance/V2_4_1_RELEASE_FINALIZATION.md)": "[`docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md`](docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md)",
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)

          roadmap = "V2.4.1\nEngineering Hardening / Durability + Security Patch\n        ✅ RELEASED"
          assert roadmap in text
          text = text.replace(roadmap, roadmap + "\n\nV2.4.2\nCorrectness / Liveness / HyperFrames Patch\n        ✅ RELEASED", 1)

          delivery = "V2.4.1 Engineering Hardening                    ✅ VERIFIED"
          assert delivery in text
          text = text.replace(delivery, delivery + "\nV2.4.2 Correctness / Liveness Patch             ✅ VERIFIED", 1)

          verify_marker = "## V2.4.1 release verification"
          assert verify_marker in text
          assert "## V2.4.2 release verification" not in text
          verify = f'''## V2.4.2 release verification

          The accepted engineering exact SHA was `c3825fe42e77c4369ec6e03d89204161764667e9`. Mandatory Local Windows acceptance passed on that exact SHA, including targeted HyperFrames real-render recertification. Cloud CI #1089 / run `33329513152` and replacement merge CI #1090 / run `33332846468` both passed all seven gates.

          PR #88 merged the exact accepted engineering head with expected-head protection as `8e8f63cd570af460a53199f45a139ee78c3a4dcb`; exact-main engineering CI #1091 / run `33333104052` passed all seven gates.

          Release PR #89 froze exact head `6d72d70930f3571c84b9d3f250c140515dbbded3`. CI #1092 / run `33333581692` passed all seven gates, and PR #89 merged with expected-head protection as release commit `{release_commit}`. Exact-main CI #1093 / run `33333816771` then passed all seven gates on that exact release commit.

          Isolated immutable-tag run `33334882825` created `v2.4.2`. Independent GitHub Git Data verification confirmed:

          ```text
          tag ref:             refs/tags/v2.4.2
          tag object type:     tag
          tag object SHA:      {tag_object}
          tag target type:     commit
          dereferenced commit: {release_commit}
          tag message:         Video OS Studio v2.4.2
          ```

          `v2.4.0` and `v2.4.1` were independently reverified and remain unchanged.

          '''
          verify = "\n".join(line.strip() if line.startswith("          ") else line for line in verify.splitlines())
          text = text.replace(verify_marker, verify + verify_marker, 1)

          real_marker = "## Real-media acceptance\n\n"
          assert real_marker in text
          real_note = "V2.4.2 final Local Windows acceptance also proved the corrected bounded B6 construction and a real HyperFrames render on Windows with deterministic built-in templates, idempotent browser provisioning, ffprobe verification, and no attributable residue.\n\n"
          text = text.replace(real_marker, real_marker + real_note, 1)
          path.write_text(text, encoding="utf-8")

          # docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md
          path = Path("docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md")
          text = path.read_text(encoding="utf-8")
          assert "`V2_4_2_RELEASE = FINALIZATION IN PROGRESS`" in text
          text = text.replace("`V2_4_2_RELEASE = FINALIZATION IN PROGRESS`", "`V2_4_2_RELEASE = COMPLETE`", 1)
          old_intro = "V2.4.2 product engineering and mandatory Local Windows acceptance are complete. The accepted product patch has been merged to `main`; package release metadata is synchronized to `2.4.2`. The immutable annotated `v2.4.2` tag must not be created until the release-finalization PR and the resulting exact-main release CI both pass all seven gates."
          new_intro = "V2.4.2 product engineering, mandatory Local Windows acceptance, release-finalization CI, immutable annotated tag creation, and independent Git Data verification are complete. The released package version is `2.4.2`; Project Schema remains `2.0.0`."
          assert old_intro in text
          text = text.replace(old_intro, new_intro, 1)

          gates_marker = "## Release-finalization gates still required"
          contract_marker = "## Release contract"
          assert gates_marker in text and contract_marker in text
          g0 = text.index(gates_marker)
          g1 = text.index(contract_marker, g0)
          complete = f'''## Release completion evidence

          Release-finalization PR #89 froze exact head:

          `6d72d70930f3571c84b9d3f250c140515dbbded3`

          CI #1092 / run `33333581692` passed all seven gates on that exact head. PR #89 then merged with expected-head protection as release commit:

          `{release_commit}`

          Exact-main CI #1093 / run `33333816771` completed `SUCCESS` on that exact release commit with all seven gates passing:

          ```text
          ubuntu-verify                    PASS
          windows-verify                   PASS
          browser-smoke                    PASS
          windows-media-smoke              PASS
          windows-b6-core-acceptance       PASS
          windows-b7-campaign-acceptance   PASS
          windows-hyperframes-smoke        PASS
          ```

          Isolated tag creation run `33334882825` then created `v2.4.2` only after proving `origin/main` still exactly equaled the release commit, the tag did not already exist, and immutable `v2.4.1` remained unchanged. The one-shot workflow removed itself from the isolated tagging branch after success.

          Independent GitHub Git Data verification confirmed:

          ```text
          ref:                 refs/tags/v2.4.2
          ref object type:     tag
          tag object SHA:      {tag_object}
          tag target type:     commit
          tag target commit:   {release_commit}
          tag message:         Video OS Studio v2.4.2
          ```

          Independent re-verification also confirmed:

          ```text
          v2.4.1 tag object:   9f3d06d8eabb114d6f1bcd907e98b4de3756a4a7
          v2.4.1 target:       4c105bad936479690711c03f3e349db36fbadaf5
          v2.4.0 tag object:   96ebdd67e2412ed4d25be36cc6120f1bba8a8734
          v2.4.0 target:       da22a5415cbf8ad2a9ce93b912b41b787b29a9b1
          ```

          '''
          complete = "\n".join(line.strip() if line.startswith("          ") else line for line in complete.splitlines())
          text = text[:g0] + complete + text[g1:]

          c0 = text.index(contract_marker)
          final_contract = f'''## Release contract

          ```text
          v2.4.2 tag:        v2.4.2 / annotated / verified
          release commit:    {release_commit}
          tag object:        {tag_object}
          release status:    COMPLETE
          product work:      UNFROZEN FOR A SEPARATELY APPROVED NEXT WORKSTREAM
          schema changes:    NONE
          local action:      NONE
          ```

          This docs-only release-truth sync does not create, move, or recreate the release tag. The immutable `v2.4.2` tag remains on `{release_commit}` even after `main` advances through documentation-only merge commits.
          '''
          final_contract = "\n".join(line.strip() if line.startswith("          ") else line for line in final_contract.splitlines())
          text = text[:c0] + final_contract
          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate docs-only net changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | sort | paste -sd ',' -)" = "PROJECT_STATUS.md,README.md,docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md"

      - name: Commit docs truth and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md
          git rm .github/workflows/v2-4-2-release-truth-sync.yml
          git commit -m "docs(v2.4.2): record immutable release truth"
          git push origin HEAD:docs/v2.4.2-release-truth
