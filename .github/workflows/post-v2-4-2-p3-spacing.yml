name: Post-V2.4.2 P3 Spacing Fix

on:
  push:
    branches:
      - docs/post-v2.4.2-p3-truth

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fix evidence alignment
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path=Path("PROJECT_STATUS.md")
          text=path.read_text(encoding="utf-8")
          old='''Issue:     #83 / CLOSED
PR:        #91 / MERGED
exact accepted PR head:        1ed2946d9fdbe8e6f17effc5c666a733138b2038
PR exact-head CI #1096:        run 33336431466 / PASS / all seven gates
post-release hardening main:    c528e2ce0fc1a64006f2fc76c5708cb808b37575
exact-main CI #1097: run 33336689239 / PASS / all seven gates / attempt 2
Local Windows action required: NO
'''
          new='''Issue:                         #83 / CLOSED
PR:                            #91 / MERGED
exact accepted PR head:        1ed2946d9fdbe8e6f17effc5c666a733138b2038
PR exact-head CI #1096:        run 33336431466 / PASS / all seven gates
post-release hardening main:    c528e2ce0fc1a64006f2fc76c5708cb808b37575
exact-main CI #1097:           run 33336689239 / PASS / all seven gates / attempt 2
Local Windows action required: NO
'''
          if text.count(old)!=1:
              raise SystemExit(f"alignment anchor drifted: {text.count(old)}")
          path.write_text(text.replace(old,new,1),encoding="utf-8")
          PY
      - name: Commit and self-remove
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/post-v2-4-2-p3-spacing.yml
          git add PROJECT_STATUS.md
          git commit -m "docs: align P3 hardening evidence"
          git push origin HEAD:docs/post-v2.4.2-p3-truth
