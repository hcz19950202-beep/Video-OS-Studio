name: V2.5.1 Post-Release Truth Sync

on:
  push:
    branches:
      - docs/v2.5.1-release-truth
    paths:
      - .github/workflows/v2-5-1-post-release-truth-sync.yml

permissions:
  contents: write

env:
  DOCS_SCRIPT_B64: ""

jobs:
  sync-release-truth:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: b6f30c08c1c85bb80c43385827baa3317c1efbb5
      TAG_NAME: v2.5.1
      TAG_OBJECT: d73595ad3a51d010d61df1c096bead911f4a31b5
      PREVIOUS_RELEASE_COMMIT: df54e10e38ee2793e8fdf285ea2c216fe8c65478
      PREVIOUS_TAG_OBJECT: bff4bf67edc95dbf4cc78019f6795c94a4e59ea5
    steps:
      - name: Checkout isolated docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/v2.5.1-release-truth
          fetch-depth: 0

      - name: Verify immutable release boundary
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$(git rev-parse 'v2.5.1^{}')" = "$RELEASE_COMMIT"
          test "$(git rev-parse v2.5.1)" = "$TAG_OBJECT"
          test "$(git rev-parse v2.5.0)" = "$PREVIOUS_TAG_OBJECT"
          test "$(git rev-parse 'v2.5.0^{}')" = "$PREVIOUS_RELEASE_COMMIT"
          test "$(node -p "require('./package.json').version")" = "2.5.1"
          test "$(node -p "require('./package-lock.json').version")" = "2.5.1"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "2.5.1"

      - name: Record V2.5.1 immutable release truth
        shell: bash
        run: |
          set -euo pipefail
          python -c 'import base64, os; exec(base64.b64decode(os.environ["DOCS_SCRIPT_B64"]))'

      - name: Commit bounded docs-only truth sync and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md docs/acceptance/V2_5_1_RELEASE_FINALIZATION.md
          git rm .github/workflows/v2-5-1-post-release-truth-sync.yml
          ACTUAL="$(git diff --cached --name-only | sort)"
          EXPECTED="$(printf '%s\n' '.github/workflows/v2-5-1-post-release-truth-sync.yml' 'PROJECT_STATUS.md' 'README.md' 'docs/acceptance/V2_5_1_RELEASE_FINALIZATION.md' | sort)"
          test "$ACTUAL" = "$EXPECTED"
          git commit -m "docs(v2.5.1): record immutable release truth"
          NET="$(git diff --name-only "$RELEASE_COMMIT"...HEAD | sort)"
          NET_EXPECTED="$(printf '%s\n' 'PROJECT_STATUS.md' 'README.md' 'docs/acceptance/V2_5_1_RELEASE_FINALIZATION.md' | sort)"
          test "$NET" = "$NET_EXPECTED"
          git diff --exit-code "$RELEASE_COMMIT"...HEAD -- package.json package-lock.json
          git push origin HEAD:docs/v2.5.1-release-truth
