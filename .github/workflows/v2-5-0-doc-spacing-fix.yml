name: V2.5.0 Docs Spacing Fix

on:
  push:
    branches:
      - docs/v2.5.0-release-truth
    paths:
      - .github/workflows/v2-5-0-doc-spacing-fix.yml

permissions:
  contents: write

jobs:
  normalize-spacing:
    runs-on: ubuntu-latest
    env:
      EXPECTED_DOCS_HEAD: a238837ca4e9e4dacda9f476cb18cfd946a6fa7e
      RELEASE_COMMIT: df54e10e38ee2793e8fdf285ea2c216fe8c65478
      TAG_OBJECT_SHA: bff4bf67edc95dbf4cc78019f6795c94a4e59ea5
    steps:
      - name: Checkout exact docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/v2.5.0-release-truth
          fetch-depth: 0

      - name: Verify frozen parent and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD^)" = "$EXPECTED_DOCS_HEAD"
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$(git cat-file -t v2.5.0)" = "tag"
          test "$(git rev-parse v2.5.0)" = "$TAG_OBJECT_SHA"
          test "$(git rev-parse 'v2.5.0^{}')" = "$RELEASE_COMMIT"

      - name: Normalize Markdown section spacing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          fixes = {
              Path("PROJECT_STATUS.md"): [
                  (
                      "C7 workflow/lock/runtime hardening.\n## Immutable V2.4.2 release truth",
                      "C7 workflow/lock/runtime hardening.\n\n## Immutable V2.4.2 release truth",
                  ),
              ],
              Path("README.md"): [
                  (
                      "Project Schema remains `2.0.0`.\n## What V2.4 adds",
                      "Project Schema remains `2.0.0`.\n\n## What V2.4 adds",
                  ),
              ],
          }
          for path, replacements in fixes.items():
              text = path.read_text(encoding="utf-8")
              for old, new in replacements:
                  assert old in text, f"expected spacing target missing in {path}"
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding="utf-8")
          PY
          git diff --check
          test "$(git diff --name-only | sort | paste -sd ',' -)" = "PROJECT_STATUS.md,README.md"

      - name: Commit spacing fix and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md
          git rm .github/workflows/v2-5-0-doc-spacing-fix.yml
          git diff --cached --check
          git commit -m "docs(v2.5.0): normalize release truth spacing"
          git push origin HEAD:docs/v2.5.0-release-truth
