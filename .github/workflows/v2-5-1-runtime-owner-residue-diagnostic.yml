name: V2.5.1 Runtime Owner Residue Diagnostic

on:
  push:
    branches:
      - release/v2.5.1-mcp-correctness
    paths:
      - .github/workflows/v2-5-1-runtime-owner-residue-diagnostic.yml

jobs:
  windows-runtime-owner-diagnostic:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Configure isolated roots
        shell: pwsh
        run: |
          $dataRoot = Join-Path $env:RUNNER_TEMP "video-os-v2-5-1-lock-diagnostic-data"
          $tempRoot = Join-Path $env:RUNNER_TEMP "video-os-v2-5-1-lock-diagnostic-temp"
          New-Item -ItemType Directory -Force -Path $dataRoot, $tempRoot | Out-Null
          "CI=true" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VIDEO_OS_DATA_ROOT=$dataRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TEMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=$tempRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Full unit suite
        run: npm run test
      - name: Inspect runtime-owner after unit
        if: always()
        shell: pwsh
        run: |
          $lock = Join-Path $env:VIDEO_OS_DATA_ROOT ".runtime-owner.lock"
          $owner = Join-Path $env:VIDEO_OS_DATA_ROOT ".runtime-owner.json"
          Write-Host "DIAG_STAGE=after-unit"
          Write-Host "DIAG_NOW_UTC=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          if (Test-Path $owner) {
            Write-Host "RUNTIME_OWNER_JSON_BEGIN"
            Get-Content -Raw $owner
            Write-Host "RUNTIME_OWNER_JSON_END"
          } else { Write-Host "RUNTIME_OWNER_JSON=ABSENT" }
          if (Test-Path $lock) {
            Write-Host "RUNTIME_OWNER_LOCK= PRESENT"
            Write-Host "RUNTIME_OWNER_LOCK_BEGIN"
            $raw = Get-Content -Raw $lock
            Write-Host $raw
            Write-Host "RUNTIME_OWNER_LOCK_END"
            try {
              $record = $raw | ConvertFrom-Json
              $pidValue = [int]$record.pid
              $proc = Get-Process -Id $pidValue -ErrorAction SilentlyContinue
              if ($proc) {
                Write-Host "LOCK_OWNER_ALIVE=YES"
                Write-Host "LOCK_OWNER_PROCESS=$($proc.ProcessName)"
                Write-Host "LOCK_OWNER_START_UTC=$($proc.StartTime.ToUniversalTime().ToString('o'))"
              } else { Write-Host "LOCK_OWNER_ALIVE=NO" }
            } catch { Write-Host "LOCK_PARSE_ERROR=$($_.Exception.Message)" }
          } else { Write-Host "RUNTIME_OWNER_LOCK=ABSENT" }
      - name: Build
        if: always()
        run: npm run build
      - name: Inspect runtime-owner after build
        if: always()
        shell: pwsh
        run: |
          $lock = Join-Path $env:VIDEO_OS_DATA_ROOT ".runtime-owner.lock"
          $owner = Join-Path $env:VIDEO_OS_DATA_ROOT ".runtime-owner.json"
          Write-Host "DIAG_STAGE=after-build"
          Write-Host "DIAG_NOW_UTC=$([DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds())"
          if (Test-Path $owner) {
            Write-Host "RUNTIME_OWNER_JSON_BEGIN"
            Get-Content -Raw $owner
            Write-Host "RUNTIME_OWNER_JSON_END"
          } else { Write-Host "RUNTIME_OWNER_JSON=ABSENT" }
          if (Test-Path $lock) {
            Write-Host "RUNTIME_OWNER_LOCK=PRESENT"
            Write-Host "RUNTIME_OWNER_LOCK_BEGIN"
            $raw = Get-Content -Raw $lock
            Write-Host $raw
            Write-Host "RUNTIME_OWNER_LOCK_END"
            try {
              $record = $raw | ConvertFrom-Json
              $pidValue = [int]$record.pid
              $proc = Get-Process -Id $pidValue -ErrorAction SilentlyContinue
              if ($proc) {
                Write-Host "LOCK_OWNER_ALIVE=YES"
                Write-Host "LOCK_OWNER_PROCESS=$($proc.ProcessName)"
                Write-Host "LOCK_OWNER_START_UTC=$($proc.StartTime.ToUniversalTime().ToString('o'))"
              } else { Write-Host "LOCK_OWNER_ALIVE=NO" }
            } catch { Write-Host "LOCK_PARSE_ERROR=$($_.Exception.Message)" }
          } else { Write-Host "RUNTIME_OWNER_LOCK=ABSENT" }
      - name: Fail if final runtime-owner lock remains
        if: always()
        shell: pwsh
        run: |
          $lock = Join-Path $env:VIDEO_OS_DATA_ROOT ".runtime-owner.lock"
          if (Test-Path $lock) { throw "Diagnostic reproduced final runtime-owner residue." }
          Write-Host "Diagnostic final runtime-owner residue absent."
