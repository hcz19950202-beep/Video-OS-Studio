name: V2.5.2 Post-Release Truth Sync

on:
  push:
    branches:
      - docs/v2.5.2-release-truth-sync

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout truth-sync helper
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release boundary
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="6b268629dc1fbce9c80a66384cc663be6692eb65"
          TAG_OBJECT_SHA="700a4dfbd2dfdee9253b28302b219129227858f9"
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "$RELEASE_SHA"
          test "$(git rev-parse HEAD^)" = "$RELEASE_SHA"
          test "$(git ls-remote origin refs/tags/v2.5.2 | awk '{print $1}')" = "$TAG_OBJECT_SHA"
          test "$(git ls-remote origin 'refs/tags/v2.5.2^{}' | awk '{print $1}')" = "$RELEASE_SHA"

      - name: Synchronize release truth documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly 1 match, found {count}")
              return text.replace(old, new, 1)

          release_sha = "6b268629dc1fbce9c80a66384cc663be6692eb65"
          tag_object = "700a4dfbd2dfdee9253b28302b219129227858f9"

          # 1) Authoritative release evidence.
          p = Path("docs/acceptance/V2_5_2_RELEASE_FINALIZATION.md")
          text = p.read_text(encoding="utf-8")
          text = replace_once(
              text,
              "`V2_5_2_RELEASE = FINALIZATION_IN_PROGRESS`",
              "`V2_5_2_RELEASE = COMPLETE`",
              "release status header",
          )
          text = replace_once(
              text,
              "Release-finalization PR exact head: **PENDING**\n\nRelease-finalization PR Standard CI: **PENDING**\n\nRelease-finalization PR V2.5 Cloud Acceptance: **PENDING**\n\nRelease merge commit: **PENDING**\n\nRelease exact-main Standard CI: **PENDING**\n\nRelease exact-main V2.5 Cloud Acceptance: **PENDING**",
              "Release-finalization PR: **PR #122**\n\nRelease-finalization PR exact head:\n\n`c2bd12ff0ac1dd58f481465f120a45f9b4b7445a`\n\nRelease-finalization PR Standard CI #1435 / run `33757699946`: **7 / 7 PASS**\n\nRelease-finalization PR V2.5 Cloud Acceptance #105 / run `33757700000`: **2 / 2 PASS**\n\nPR #122 was merged only after exact-head gates were green, using expected-head protection.\n\nRelease merge commit:\n\n`6b268629dc1fbce9c80a66384cc663be6692eb65`\n\nThe release merge commit is GitHub-signature verified.\n\nRelease exact-main Standard CI #1436 / run `33758451245`: **7 / 7 PASS**\n\nRelease exact-main V2.5 Cloud Acceptance #106 / run `33758451201`: **2 / 2 PASS**",
              "release candidate completion",
          )
          text = replace_once(
              text,
              "Current tag state at version-finalization start:\n\n`refs/tags/v2.5.2 = ABSENT`\n\nImmutable tag creation: **PENDING**\n\nTag object SHA: **PENDING**\n\nTag target release commit: **PENDING**",
              "Before immutable tag creation, `main` was independently rechecked to still equal release commit `6b268629dc1fbce9c80a66384cc663be6692eb65`, and `refs/tags/v2.5.2` was independently confirmed absent.\n\nIsolated one-shot immutable-tag run `33759152930`: **PASS**. The workflow verified the immutable boundary, created the annotated tag, independently verified the remote peeled target, and self-deleted from `release/v2.5.2-tagging`.\n\nIndependent GitHub Git Data verification confirmed:\n\n```text\nref:                 refs/tags/v2.5.2\nref object type:     tag\ntag object SHA:      700a4dfbd2dfdee9253b28302b219129227858f9\ntag target type:     commit\ntag target commit:   6b268629dc1fbce9c80a66384cc663be6692eb65\ntag message:         Video OS Studio v2.5.2\n```\n\nThe tag object is unsigned. It is therefore recorded as an **annotated, independently verified immutable tag**, not as cryptographically signed.",
              "immutable tag completion",
          )
          text = replace_once(
              text,
              "Post-release truth-sync PR: **PENDING**\n\nTruth-synced main: **PENDING**\n\nPost-truth-main gates: **PENDING**\n\nPost-truth tag re-verification: **PENDING**",
              "This post-release truth synchronization is documentation-only. It updates `PROJECT_STATUS.md`, `README.md`, and this authoritative release record. It does not create, move, recreate or retarget `v2.5.2`; the immutable tag remains on the release commit even after `main` later advances through documentation-only merge commits.\n\nThe truth-sync change set must itself pass fresh PR gates before merge, and the resulting documentation-only `main` must pass the normal post-merge gates. The immutable tag must then be re-read from Git Data to prove it remains unchanged.",
              "truth sync contract",
          )
          text = replace_once(
              text,
              "release commit:       PENDING\nv2.5.2 tag:           PENDING\nrelease status:       FINALIZATION_IN_PROGRESS",
              "release commit:       6b268629dc1fbce9c80a66384cc663be6692eb65\nv2.5.2 tag:           v2.5.2 / annotated / independently verified\ntag object:           700a4dfbd2dfdee9253b28302b219129227858f9\nrelease status:       COMPLETE",
              "release contract",
          )
          p.write_text(text, encoding="utf-8")

          # 2) Live project status.
          p = Path("PROJECT_STATUS.md")
          text = p.read_text(encoding="utf-8")
          replacements = [
              ("released_product_version: 2.5.1", "released_product_version: 2.5.2", "status product version"),
              ("released_tag: v2.5.1", "released_tag: v2.5.2", "status tag"),
              ("released_commit: b6f30c08c1c85bb80c43385827baa3317c1efbb5", f"released_commit: {release_sha}", "status release commit"),
              ("released_tag_object_sha: d73595ad3a51d010d61df1c096bead911f4a31b5", f"released_tag_object_sha: {tag_object}", "status tag object"),
              ("package_json_version: 2.5.1", "package_json_version: 2.5.2", "status package version"),
              ("package_lock_version: 2.5.1", "package_lock_version: 2.5.2", "status lock version"),
              ("active_stage: V2.5.1 RELEASE COMPLETE", "active_stage: V2.5.2 RELEASE COMPLETE", "status active stage"),
              ("next_action: NONE — V2.5.1 is released; future product work requires a separately approved next workstream", "next_action: NONE — V2.5.2 is released; future product work requires a separately approved next workstream", "status next action"),
              ("v2_5_1_status: RELEASED", "v2_5_1_status: RELEASED\nv2_5_2_status: RELEASED", "status release flag"),
          ]
          for old, new, label in replacements:
              text = replace_once(text, old, new, label)

          text = replace_once(
              text,
              "v2_5_1_release_tag_creation: run 33746191919 / PASS",
              "v2_5_1_release_tag_creation: run 33746191919 / PASS\n"
              "v2_5_2_engineering_audit_pr: PR #120 / CLOSED UNMERGED\n"
              "v2_5_2_engineering_merge_pr: PR #121\n"
              "v2_5_2_accepted_source_head: c93fee31a54c045c9da5fefd5de14cd8437847f3\n"
              "v2_5_2_accepted_source_tree: 28859a3a549158bd7db43d81d2f1a2a6d1a9227d\n"
              "v2_5_2_engineering_main: dfb5c0b271742c499a62a5d273fe0df08bc1afda\n"
              "v2_5_2_engineering_main_dedicated_ci: run 33756286459 / PASS / 2 of 2\n"
              "v2_5_2_engineering_main_standard_ci: run 33756286475 / PASS / attempt 2 / 7 of 7\n"
              "v2_5_2_local_windows_gate: c93fee31a54c045c9da5fefd5de14cd8437847f3 / PASS\n"
              "v2_5_2_release_metadata_sync: run 33757369315 / PASS\n"
              "v2_5_2_release_finalization_pr: PR #122\n"
              "v2_5_2_release_pr_frozen_head: c2bd12ff0ac1dd58f481465f120a45f9b4b7445a\n"
              "v2_5_2_release_pr_dedicated_ci: run 33757700000 / PASS / 2 of 2\n"
              "v2_5_2_release_pr_standard_ci: run 33757699946 / PASS / 7 of 7\n"
              "v2_5_2_release_commit: 6b268629dc1fbce9c80a66384cc663be6692eb65\n"
              "v2_5_2_release_main_dedicated_ci: run 33758451201 / PASS / 2 of 2\n"
              "v2_5_2_release_main_standard_ci: run 33758451245 / PASS / 7 of 7\n"
              "v2_5_2_release_tag_creation: run 33759152930 / PASS\n"
              "v2_5_2_release_tag_object: 700a4dfbd2dfdee9253b28302b219129227858f9",
              "status v2.5.2 evidence",
          )

          v252_truth = """## Immutable V2.5.2 release truth

Video OS Studio V2.5.2 is released at the independently verified annotated tag `v2.5.2`.

```text
release commit:      6b268629dc1fbce9c80a66384cc663be6692eb65
annotated tag:       v2.5.2
tag object SHA:      700a4dfbd2dfdee9253b28302b219129227858f9
tag target type:     commit
dereferenced target: 6b268629dc1fbce9c80a66384cc663be6692eb65
tag message:         Video OS Studio v2.5.2
```

Accepted V2.5.2 source SHA `c93fee31a54c045c9da5fefd5de14cd8437847f3` and tree `28859a3a549158bd7db43d81d2f1a2a6d1a9227d` passed exact-head Standard #1432 (7/7), Dedicated #102 (2/2), and Mandatory Local Windows acceptance. Draft PR #120 was closed unmerged; replacement PR #121 merged the identical accepted source with expected-head protection as engineering main `dfb5c0b271742c499a62a5d273fe0df08bc1afda`.

Engineering exact-main Dedicated #104 / run `33756286459` passed 2/2. Standard #1434 / run `33756286475` finished 7/7 PASS at attempt 2. Its first browser attempt exposed the existing C7 startup-test race where the status assertion could accept `disconnected` before the bridge address was published, yielding `Not running`; the identical main already passed C7 in Dedicated #104 and a single controlled identical-SHA browser rerun passed. No source or test patch was made.

Release version-sync run `33757369315` bounded metadata changes to the three package version fields. Release-finalization PR #122 froze head `c2bd12ff0ac1dd58f481465f120a45f9b4b7445a`; Standard #1435 / run `33757699946` passed 7/7 and Dedicated #105 / run `33757700000` passed 2/2. Expected-head merge produced GitHub-signature-verified release commit `6b268629dc1fbce9c80a66384cc663be6692eb65`.

Release exact-main Standard #1436 / run `33758451245` passed 7/7 and Dedicated #106 / run `33758451201` passed 2/2, including browser, real Media, HyperFrames, B6 and B7 gates. Isolated immutable-tag run `33759152930` then created `v2.5.2` only after proving `origin/main` still exactly equaled the release commit and the tag did not already exist. Independent GitHub Git Data verification proved `refs/tags/v2.5.2` points to object type `tag`, tag object `700a4dfbd2dfdee9253b28302b219129227858f9`, targeting the exact release commit with message `Video OS Studio v2.5.2`.

The tag object is unsigned; the correct release language is **annotated, independently verified immutable tag**.

Authoritative release evidence:

`docs/acceptance/V2_5_2_RELEASE_FINALIZATION.md`

## V2.5.2 accepted product truth

V2.5.2 adds durable built-in Agent provider/model routing and Composer control without changing Project Schema or Project mutation authority. New Sessions can select a configured provider/model; existing Sessions pin their durable `providerId + model`, reopen with the same identity, and execute Turns from persisted identity rather than current server defaults. Unsupported/unconfigured provider/model states fail explicitly, client Turn requests cannot override current Session identity, and provider secrets are not exposed in the runtime catalog or UI.

"""
          text = replace_once(
              text,
              "## Immutable V2.5.1 release truth",
              v252_truth + "## Immutable V2.5.1 release truth",
              "status immutable v2.5.2 section",
          )
          timeline_anchor = "V2.5.1 RELEASE / PR #118 / release commit b6f30c08c1c85bb80c43385827baa3317c1efbb5 / Standard exact-main 7 of 7 PASS / Dedicated exact-main 2 of 2 PASS / annotated tag verified"
          text = replace_once(
              text,
              timeline_anchor,
              timeline_anchor + "\nV2.5.2 RELEASE / PR #122 / release commit 6b268629dc1fbce9c80a66384cc663be6692eb65 / Standard exact-main 7 of 7 PASS / Dedicated exact-main 2 of 2 PASS / annotated tag verified",
              "status delivery history",
          )
          p.write_text(text, encoding="utf-8")

          # 3) README current release and compact verification.
          p = Path("README.md")
          text = p.read_text(encoding="utf-8")
          readme_replacements = [
              ("**Video OS Studio v2.5.1 is released.**", "**Video OS Studio v2.5.2 is released.**", "readme release header"),
              ("Product version: 2.5.1", "Product version: 2.5.2", "readme product version"),
              ("Release commit: b6f30c08c1c85bb80c43385827baa3317c1efbb5", f"Release commit: {release_sha}", "readme release commit"),
              ("Release tag: v2.5.1 (annotated, verified)", "Release tag: v2.5.2 (annotated, independently verified)", "readme tag"),
              ("Tag object: d73595ad3a51d010d61df1c096bead911f4a31b5", f"Tag object: {tag_object}", "readme tag object"),
              ("The annotated `v2.5.1` tag is the immutable current release boundary. Previous `v2.3.0`, `v2.3.1`, `v2.4.0`, `v2.4.1`, `v2.4.2`, and `v2.5.0` release tags remain immutable evidence and must never be moved or recreated.", "The annotated `v2.5.2` tag is the immutable current release boundary. Previous `v2.3.0`, `v2.3.1`, `v2.4.0`, `v2.4.1`, `v2.4.2`, `v2.5.0`, and `v2.5.1` release tags remain immutable evidence and must never be moved or recreated.", "readme immutable boundary"),
              ("[`docs/acceptance/V2_5_1_RELEASE_FINALIZATION.md`](docs/acceptance/V2_5_1_RELEASE_FINALIZATION.md)", "[`docs/acceptance/V2_5_2_RELEASE_FINALIZATION.md`](docs/acceptance/V2_5_2_RELEASE_FINALIZATION.md)", "readme evidence link"),
          ]
          for old, new, label in readme_replacements:
              text = replace_once(text, old, new, label)

          text = replace_once(
              text,
              "V2.5.1\nRuntime Correctness + Release Metadata Patch\n        ✅ RELEASED",
              "V2.5.1\nRuntime Correctness + Release Metadata Patch\n        ✅ RELEASED\n\nV2.5.2\nDurable Agent Provider/Model Routing + Composer Control\n        ✅ RELEASED",
              "readme roadmap v2.5.2",
          )

          what_v252 = """## What V2.5.2 adds

V2.5.2 productizes durable built-in Agent provider/model routing while preserving the accepted V2.5 Agent workspace and mutation boundaries:

```text
configured Provider/Model catalog
→ New Session provider/model selection
→ durable Session providerId + model identity
→ reopen with pinned identity
→ Turn execution from persisted identity
→ explicit fail-closed unsupported/unconfigured states
→ no client override of current Session provider/model
```

Volcengine Agent Plan, OpenAI Responses, and DeepSeek Chat are routed through the built-in provider runtime. The Composer exposes Provider/Model controls for the next/new Session, while the current Session identity remains pinned. Project Schema stays `2.0.0`, and Project mutation authority is unchanged.

"""
          text = replace_once(
              text,
              "## What V2.5 adds",
              what_v252 + "## What V2.5 adds",
              "readme v2.5.2 capability section",
          )

          verification = """## V2.5.2 release verification

Accepted source SHA `c93fee31a54c045c9da5fefd5de14cd8437847f3` and source tree `28859a3a549158bd7db43d81d2f1a2a6d1a9227d` passed Standard #1432 (7/7), Dedicated #102 (2/2), and Mandatory Local Windows acceptance. Replacement PR #121 merged the identical accepted source with expected-head protection as engineering main `dfb5c0b271742c499a62a5d273fe0df08bc1afda`.

Engineering exact-main Dedicated #104 / run `33756286459` passed 2/2. Standard #1434 / run `33756286475` finished 7/7 PASS at attempt 2 after preserving one C7 bridge-startup test race; the identical SHA passed C7 in Dedicated and in the controlled browser rerun, with no source/test patch.

Release-finalization PR #122 froze exact head `c2bd12ff0ac1dd58f481465f120a45f9b4b7445a`. Standard #1435 / run `33757699946` passed 7/7 and Dedicated #105 / run `33757700000` passed 2/2. Expected-head merge produced GitHub-signature-verified release commit `6b268629dc1fbce9c80a66384cc663be6692eb65`. Release exact-main Standard #1436 / run `33758451245` passed 7/7 and Dedicated #106 / run `33758451201` passed 2/2.

Isolated immutable-tag run `33759152930` created `v2.5.2`. Independent GitHub Git Data verification confirmed:

```text
tag ref:             refs/tags/v2.5.2
tag object type:     tag
tag object SHA:      700a4dfbd2dfdee9253b28302b219129227858f9
tag target type:     commit
dereferenced commit: 6b268629dc1fbce9c80a66384cc663be6692eb65
tag message:         Video OS Studio v2.5.2
```

The tag object is unsigned; it is an annotated, independently verified immutable tag.

"""
          text = replace_once(
              text,
              "## V2.5.1 release verification",
              verification + "## V2.5.1 release verification",
              "readme release verification",
          )
          p.write_text(text, encoding="utf-8")
          PY

      - name: Remove helper and prove docs-only net scope
        shell: bash
        run: |
          set -euo pipefail
          RELEASE_SHA="6b268629dc1fbce9c80a66384cc663be6692eb65"
          git rm .github/workflows/v2-5-2-truth-sync.yml
          mapfile -t files < <(git diff --name-only "$RELEASE_SHA" | sort)
          expected=(
            "PROJECT_STATUS.md"
            "README.md"
            "docs/acceptance/V2_5_2_RELEASE_FINALIZATION.md"
          )
          mapfile -t expected_sorted < <(printf '%s\n' "${expected[@]}" | sort)
          test "${#files[@]}" -eq 3
          test "$(printf '%s\n' "${files[@]}")" = "$(printf '%s\n' "${expected_sorted[@]}")"

      - name: Commit post-release truth synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md docs/acceptance/V2_5_2_RELEASE_FINALIZATION.md .github/workflows/v2-5-2-truth-sync.yml
          git commit -m "docs(v2.5.2): synchronize immutable release truth"
          git push origin HEAD:docs/v2.5.2-release-truth-sync
