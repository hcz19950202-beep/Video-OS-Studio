name: V2.5.3 Release Truth Sync

on:
  push:
    branches:
      - docs/v2.5.3-release-truth-sync

permissions:
  contents: write

jobs:
  sync-release-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout truth-sync branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify immutable release boundary and helper scope
        shell: bash
        run: |
          set -euo pipefail
          release="c05bf836362ccf19c81bf2023f0838d560808ab4"
          tag_object="66c43b7bd861d74f0abe046e063181c948981409"
          git fetch origin main --tags
          main_sha="$(git rev-parse origin/main)"
          if [ "$main_sha" != "$release" ]; then
            echo "main drifted: expected $release, got $main_sha" >&2
            exit 1
          fi
          git merge-base --is-ancestor "$release" HEAD
          remote_object="$(git ls-remote --tags origin 'refs/tags/v2.5.3' | awk '{print $1}')"
          remote_target="$(git ls-remote --tags origin 'refs/tags/v2.5.3^{}' | awk '{print $1}')"
          if [ "$remote_object" != "$tag_object" ]; then
            echo "tag object drifted: expected $tag_object, got $remote_object" >&2
            exit 1
          fi
          if [ "$remote_target" != "$release" ]; then
            echo "tag target drifted: expected $release, got $remote_target" >&2
            exit 1
          fi
          actual="$(git diff --name-only "$release"...HEAD | sort)"
          expected="$(printf '%s\n' '.github/workflows/v2-5-3-truth-sync.yml' 'scripts/v2-5-3-truth-sync.py' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "unexpected staged helper scope" >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          fi

      - name: Synchronize release truth documents
        run: python scripts/v2-5-3-truth-sync.py

      - name: Remove helpers and prove final docs-only scope
        shell: bash
        run: |
          set -euo pipefail
          release="c05bf836362ccf19c81bf2023f0838d560808ab4"
          tag_object="66c43b7bd861d74f0abe046e063181c948981409"
          rm .github/workflows/v2-5-3-truth-sync.yml
          rm scripts/v2-5-3-truth-sync.py
          actual="$(git diff --name-only "$release" | sort)"
          expected="$(printf '%s\n' 'PROJECT_STATUS.md' 'README.md' 'docs/acceptance/V2_5_3_RELEASE_FINALIZATION.md' | sort)"
          if [ "$actual" != "$expected" ]; then
            echo "final net scope is not exactly the three release-truth docs" >&2
            printf 'actual:\n%s\nexpected:\n%s\n' "$actual" "$expected" >&2
            exit 1
          fi
          remote_object="$(git ls-remote --tags origin 'refs/tags/v2.5.3' | awk '{print $1}')"
          remote_target="$(git ls-remote --tags origin 'refs/tags/v2.5.3^{}' | awk '{print $1}')"
          if [ "$remote_object" != "$tag_object" ] || [ "$remote_target" != "$release" ]; then
            echo "immutable tag changed during truth sync" >&2
            exit 1
          fi
          grep -F '`V2_5_3_RELEASE = COMPLETE`' docs/acceptance/V2_5_3_RELEASE_FINALIZATION.md
          grep -F '**Video OS Studio v2.5.3 is released.**' README.md
          grep -F 'released_product_version: 2.5.3' PROJECT_STATUS.md
          grep -F 'released_commit: c05bf836362ccf19c81bf2023f0838d560808ab4' PROJECT_STATUS.md
          grep -F 'released_tag_object_sha: 66c43b7bd861d74f0abe046e063181c948981409' PROJECT_STATUS.md

      - name: Commit and push docs-only truth sync
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs(v2.5.3): synchronize immutable release truth"
          git push origin HEAD:docs/v2.5.3-release-truth-sync
