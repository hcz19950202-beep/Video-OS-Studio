name: V2.5.1 Workflow Service Lazy Recovery Fix

on:
  push:
    branches:
      - release/v2.5.1-mcp-correctness
    paths:
      - .github/workflows/v2-5-1-workflow-service-lazy-recovery-fix.yml

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout helper commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Verify exact helper branch tip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:GITHUB_SHA) { throw 'helper HEAD mismatch' }
          if ((git rev-parse origin/release/v2.5.1-mcp-correctness).Trim() -ne $env:GITHUB_SHA) { throw 'branch tip mismatch' }

      - name: Apply lazy Workflow recovery and catalog zero-IO regression
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path

          service = Path("lib/workflows/service.ts")
          text = service.read_text(encoding="utf-8")
          old = '''export class WorkflowService{
            private readonly startupRecovery:Promise<void>;

            constructor(
              readonly projects:WorkflowProjectReader,
              readonly store:FileWorkflowStore,
              readonly definitions:WorkflowDefinitionRegistry,
              readonly runner:WorkflowRunner,
            ){
              this.startupRecovery=this.runner.recover();
            }

            private ready(){return this.startupRecovery;}
          '''
          new = '''export class WorkflowService{
            private startupRecovery:Promise<void>|undefined;

            constructor(
              readonly projects:WorkflowProjectReader,
              readonly store:FileWorkflowStore,
              readonly definitions:WorkflowDefinitionRegistry,
              readonly runner:WorkflowRunner,
            ){}

            private ready(){return this.startupRecovery??=this.runner.recover();}
          '''
          assert text.count(old) == 1, "unexpected WorkflowService startup recovery shape"
          service.write_text(text.replace(old, new, 1), encoding="utf-8")

          permission = Path("tests/v2-5-c5-permission-center.test.ts")
          permission.write_text('''import {access,mkdtemp,rm} from "node:fs/promises";
          import {tmpdir} from "node:os";
          import {join} from "node:path";
          import {afterEach,describe,expect,it,vi} from "vitest";
          import {C5_CREATE_EDIT_PROPOSAL_TOOL_ID} from "@/lib/ai/tools/shared-proposal-tools";

          const roots:string[]=[];
          const previousDataRoot=process.env.VIDEO_OS_DATA_ROOT;

          afterEach(async()=>{
            if(previousDataRoot===undefined)delete process.env.VIDEO_OS_DATA_ROOT;else process.env.VIDEO_OS_DATA_ROOT=previousDataRoot;
            vi.resetModules();
            await Promise.all(roots.splice(0).map(root=>rm(root,{recursive:true,force:true})));
          });

          describe("V2.5 C5 Permission Center catalog",()=>{
            it("reports controlled MCP authority without starting durable runtime ownership",async()=>{
              const root=await mkdtemp(join(tmpdir(),"video-os-c5-permission-center-"));
              roots.push(root);
              process.env.VIDEO_OS_DATA_ROOT=root;
              vi.resetModules();
              const{getLocalMcpControlledToolCatalog}=await import("@/lib/server/mcp-runtime");
              const catalog=getLocalMcpControlledToolCatalog();
              const proposal=catalog.find(tool=>tool.id===C5_CREATE_EDIT_PROPOSAL_TOOL_ID);

              expect(proposal).toMatchObject({
                riskClass:"R1",
                authority:"proposal-only",
                approval:{defaultMode:"auto",allowSessionOverride:false},
                revisionPolicy:"snapshot",
                idempotency:"proposal-only",
              });
              expect(proposal?.requiredScopes).toContain("project:propose");
              expect(proposal?.requiredScopes).not.toContain("project:write");

              for(const tool of catalog){
                expect(["R0","R1"]).toContain(tool.riskClass);
                if(tool.riskClass==="R0")expect(tool.authority).toBe("direct-read");
                if(tool.riskClass==="R1"){
                  expect(tool.authority).toBe("proposal-only");
                  expect(tool.approval).toEqual({defaultMode:"auto",allowSessionOverride:false});
                  expect(tool.requiredScopes).not.toContain("project:write");
                }
              }

              await new Promise(resolve=>setTimeout(resolve,100));
              await expect(access(join(root,".runtime-owner.json"))).rejects.toMatchObject({code:"ENOENT"});
              await expect(access(join(root,".runtime-owner.lock"))).rejects.toMatchObject({code:"ENOENT"});
            });
          });
          ''', encoding="utf-8")
          '@ | python -

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Format touched source and test
        run: npx prettier --write lib/workflows/service.ts tests/v2-5-c5-permission-center.test.ts

      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Permission Center isolated zero-IO regression
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'permission-center-fix-verification'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:VIDEO_OS_DATA_ROOT = Join-Path $root 'data'
          $env:TEMP = Join-Path $root 'temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:VIDEO_OS_DATA_ROOT,$env:TEMP | Out-Null
          npx vitest run tests/v2-5-c5-permission-center.test.ts --pool=forks --maxWorkers=1 --minWorkers=1
          if($LASTEXITCODE -ne 0){exit $LASTEXITCODE}
          $lock=Join-Path $env:VIDEO_OS_DATA_ROOT '.runtime-owner.lock'
          $owner=Join-Path $env:VIDEO_OS_DATA_ROOT '.runtime-owner.json'
          if(Test-Path $lock){Write-Host 'OUTER_LOCK_PRESENT=YES';Get-Content -Raw $lock;throw 'Permission Center left runtime-owner lock.'}
          if(Test-Path $owner){Write-Host 'OUTER_OWNER_PRESENT=YES';Get-Content -Raw $owner;throw 'Permission Center created runtime-owner metadata.'}
          Write-Host 'PERMISSION_CENTER_ZERO_RUNTIME_OWNER_IO=PASS'

      - name: Workflow recovery and runtime regressions
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'workflow-lazy-recovery-targeted'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:VIDEO_OS_DATA_ROOT = Join-Path $root 'data'
          $env:TEMP = Join-Path $root 'temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:VIDEO_OS_DATA_ROOT,$env:TEMP | Out-Null
          npx vitest run tests/workflow-w5-hardening.test.ts tests/workflow-runtime.test.ts tests/workflow-review-invalidation.test.ts tests/v2.4-final-audit-runtime-lifecycle.test.ts tests/durable-jobs-h3.test.ts --maxWorkers=2

      - name: Remove all temporary diagnostics and verify bounded diff
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $temporary = @(
            '.github/workflows/v2-5-1-runtime-owner-residue-diagnostic.yml',
            '.github/workflows/v2-5-1-runtime-owner-file-isolation.yml',
            '.github/workflows/v2-5-1-runtime-owner-stack-diagnostic.yml',
            '.github/workflows/v2-5-1-workflow-service-lazy-recovery-fix.yml'
          )
          foreach($path in $temporary){if(Test-Path $path){Remove-Item $path}}
          git diff --check
          $changed = @(git diff --name-only HEAD | Sort-Object)
          $expected = @(
            '.github/workflows/v2-5-1-runtime-owner-file-isolation.yml',
            '.github/workflows/v2-5-1-runtime-owner-residue-diagnostic.yml',
            '.github/workflows/v2-5-1-runtime-owner-stack-diagnostic.yml',
            '.github/workflows/v2-5-1-workflow-service-lazy-recovery-fix.yml',
            'lib/workflows/service.ts',
            'tests/v2-5-c5-permission-center.test.ts'
          ) | Sort-Object
          if(($changed -join "`n") -ne ($expected -join "`n")){throw "Unexpected fix diff:`n$($changed -join "`n")"}

      - name: Commit and push exact product fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(v2.5.1): defer workflow startup recovery"
          git push --force-with-lease=refs/heads/release/v2.5.1-mcp-correctness:$env:GITHUB_SHA origin HEAD:refs/heads/release/v2.5.1-mcp-correctness
