name: V2.4.2 B6 auto-import clip fixture fix

on:
  push:
    branches:
      - fix/v2.4.2-correctness-liveness

permissions:
  contents: write

jobs:
  patch-b6-auto-import-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/v2.4.2-correctness-liveness
          fetch-depth: 0
      - name: Add auto-imported source clip ownership to Windows B6 fixture
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'tests/h6/windows-b6-core-acceptance.test.ts';
          const source = fs.readFileSync(path, 'utf8');
          const marker = 'B6 auto-imported source clip is explicitly AI-owned for bounded QA timing repair.';
          if (source.includes(marker)) process.exit(0);
          const anchor = [
            '      await protection.markAiOwned(',
            '        projectId,',
            '        { kind: "clip", id: "b6-source-video" },',
            '        baseRevision,',
            '        "B6 acceptance source video is explicitly AI-owned for bounded QA timing repair.",',
            '      );',
          ].join('\n');
          const addition = [
            anchor,
            '      await protection.markAiOwned(',
            '        projectId,',
            '        { kind: "clip", id: `clip-${imported.import.assetId}` },',
            '        baseRevision,',
            '        "B6 auto-imported source clip is explicitly AI-owned for bounded QA timing repair.",',
            '      );',
          ].join('\n');
          if (!source.includes(anchor)) throw new Error('Expected B6 source ownership anchor not found.');
          fs.writeFileSync(path, source.replace(anchor, addition));
          NODE
      - name: Commit targeted fixture correction
        shell: bash
        run: |
          if git diff --quiet -- tests/h6/windows-b6-core-acceptance.test.ts; then
            echo "Fixture already corrected."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/h6/windows-b6-core-acceptance.test.ts
          git commit -m "test(v2.4.2): mark B6 imported clip AI-owned"
          git push origin HEAD:fix/v2.4.2-correctness-liveness
