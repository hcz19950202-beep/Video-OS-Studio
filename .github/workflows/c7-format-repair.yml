name: C7 Format Repair

on:
  push:
    branches:
      - release/v2.5-acceptance-hardening

permissions:
  contents: read

jobs:
  format-c7-acceptance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository formatter
        run: npm run format
      - name: Verify repository formatter
        run: npm run format:check
      - name: Upload formatted C7 acceptance
        uses: actions/upload-artifact@v4
        with:
          name: c7-formatted-acceptance
          path: tests/e2e/v2-5-c7-agent-mcp-acceptance.spec.ts
          if-no-files-found: error
