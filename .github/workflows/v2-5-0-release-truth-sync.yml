name: V2.5.0 Release Truth Sync

on:
  push:
    branches:
      - docs/v2.5.0-release-truth
    paths:
      - .github/workflows/v2-5-0-release-truth-sync.yml

permissions:
  contents: write

jobs:
  sync-release-truth:
    runs-on: ubuntu-latest
    env:
      RELEASE_COMMIT: df54e10e38ee2793e8fdf285ea2c216fe8c65478
      TAG_OBJECT_SHA: bff4bf67edc95dbf4cc78019f6795c94a4e59ea5
    steps:
      - name: Checkout isolated docs branch
        uses: actions/checkout@v4
        with:
          ref: docs/v2.5.0-release-truth
          fetch-depth: 0

      - name: Verify immutable release truth before docs mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$RELEASE_COMMIT"
          test "$(git rev-parse HEAD^)" = "$RELEASE_COMMIT"
          test "$(git cat-file -t v2.5.0)" = "tag"
          test "$(git rev-parse v2.5.0)" = "$TAG_OBJECT_SHA"
          test "$(git rev-parse 'v2.5.0^{}')" = "$RELEASE_COMMIT"
          test "$(git rev-parse v2.4.2)" = "2c9b0ca2401f547066c6a51ff0ec60a641cfce35"
          test "$(git rev-parse 'v2.4.2^{}')" = "79e48b068f701bba3f1c826710337a82f0a64760"
          test "$(node -p "require('./package.json').version")" = "2.5.0"
          test "$(node -p "require('./package-lock.json').version")" = "2.5.0"
          test "$(node -p "require('./package-lock.json').packages[''].version")" = "2.5.0"

      - name: Update release truth documents
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          release_commit = "df54e10e38ee2793e8fdf285ea2c216fe8c65478"
          tag_object = "bff4bf67edc95dbf4cc78019f6795c94a4e59ea5"

          # PROJECT_STATUS.md — preserve historical V2.4 audit fields and add V2.5 truth.
          path = Path("PROJECT_STATUS.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "released_product_version: 2.4.2": "released_product_version: 2.5.0",
              "released_tag: v2.4.2": "released_tag: v2.5.0",
              "released_commit: 79e48b068f701bba3f1c826710337a82f0a64760": f"released_commit: {release_commit}",
              "released_tag_object_sha: 2c9b0ca2401f547066c6a51ff0ec60a641cfce35": f"released_tag_object_sha: {tag_object}",
              "package_json_version: 2.4.2": "package_json_version: 2.5.0",
              "package_lock_version: 2.4.2": "package_lock_version: 2.5.0",
              "active_stage: FINAL V2.4.x INDEPENDENT AUDIT COMPLETE": "active_stage: V2.5.0 RELEASE COMPLETE",
              "next_action: NONE — V2.4.x hardening is complete; future product work requires separate approval; V2.5 remains paused and unapproved": "next_action: NONE — V2.5.0 is released; future product work requires a separately approved next workstream",
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)

          assert "v2_5_status:" not in text
          anchor = "release_tag_creation: run 33334882825 / PASS\n"
          assert anchor in text
          v25_checkpoint = f'''{anchor}v2_5_engineering_audit_pr: PR #112 / CLOSED UNMERGED
          v2_5_engineering_merge_pr: PR #113
          v2_5_accepted_source_head: 58d303db9f39b24b5883a4d408d523d5f3617279
          v2_5_engineering_main: 79867fa26d837fb4f36dc2c60dd07c15ee88c4fd
          v2_5_engineering_main_dedicated_ci: run 33670276121 / PASS
          v2_5_engineering_main_standard_ci: run 33670276165 / PASS / 7 of 7
          v2_5_local_windows_gate: 58d303db9f39b24b5883a4d408d523d5f3617279 / S01-S16 PASS
          v2_5_release_metadata_sync: run 33671108580 / PASS
          v2_5_release_finalization_pr: PR #114
          v2_5_release_pr_frozen_head: 3d23c55de780b8b028b0665c14d99b0cc148f4fe
          v2_5_release_pr_dedicated_ci: run 33671444645 / PASS
          v2_5_release_pr_standard_ci: run 33671444664 / PASS / 7 of 7
          v2_5_release_commit: {release_commit}
          v2_5_release_main_dedicated_ci: run 33672088362 / PASS
          v2_5_release_main_standard_ci: run 33672088402 / PASS / 7 of 7
          v2_5_release_tag_creation: run 33673004195 / PASS
          '''
          v25_checkpoint = "\n".join(line.strip() if line.startswith("          ") else line for line in v25_checkpoint.splitlines()) + "\n"
          text = text.replace(anchor, v25_checkpoint, 1)

          status_anchor = "final_v2_4_audit_status: COMPLETE\n"
          assert status_anchor in text
          text = text.replace(status_anchor, status_anchor + "v2_5_status: RELEASED\n", 1)

          marker = "## Immutable V2.4.2 release truth"
          assert marker in text
          assert "## Immutable V2.5.0 release truth" not in text
          insert = f'''## Immutable V2.5.0 release truth

          Video OS Studio V2.5.0 is released at the independently verified annotated tag `v2.5.0`.

          ```text
          release commit:      {release_commit}
          annotated tag:       v2.5.0
          tag object SHA:      {tag_object}
          tag target type:     commit
          dereferenced target: {release_commit}
          tag message:         Video OS Studio v2.5.0
          ```

          Accepted C7 source SHA `58d303db9f39b24b5883a4d408d523d5f3617279` passed source cloud acceptance and Mandatory Local Windows S01–S16. PR #113 merged that exact source to engineering main `79867fa26d837fb4f36dc2c60dd07c15ee88c4fd`; engineering exact-main Dedicated run `33670276121` and Standard run `33670276165` passed.

          Release-finalization PR #114 froze exact head `3d23c55de780b8b028b0665c14d99b0cc148f4fe`. Its Dedicated run `33671444645` and Standard run `33671444664` passed, then expected-head merge produced release commit `{release_commit}`. Release exact-main Dedicated run `33672088362` and Standard run `33672088402` passed, with Standard 7/7 green.

          Isolated immutable-tag run `33673004195` created `v2.5.0` only after proving `origin/main` still exactly equaled the release commit, package metadata was exactly `2.5.0`, the new tag did not already exist, and immutable `v2.4.2` remained unchanged. Independent GitHub Git Data verification proved `refs/tags/v2.5.0` points to object type `tag`, tag object `{tag_object}`, which targets `{release_commit}` with message `Video OS Studio v2.5.0`.

          Immutable `v2.4.0`, `v2.4.1`, and `v2.4.2` were independently reverified and remain unchanged.

          Authoritative release evidence:

          `docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md`

          ## V2.5.0 accepted product truth

          V2.5.0 is the Agent-native Workspace + Local MCP release. It preserves `project.json` as editing truth and Project Schema `2.0.0`, while adding the unified Agent workspace, ContextReference/Selection semantics, shared Tool Registry, authenticated loopback MCP reads/proposals/approval path, durable external-agent audit/history/job truth, production-surface integration, and C7 workflow/lock/runtime hardening.

          '''
          insert = "\n".join(line.strip() if line.startswith("          ") else line for line in insert.splitlines())
          text = text.replace(marker, insert + marker, 1)

          history_anchor = "FINAL V2.4.x INDEPENDENT AUDIT / Issue #94 CLOSED / PR #96 / exact head 09f06c63968e888411bd0b94d495374f396ad95d / main 3b8c6c61894d4b8437aafa1d48fd32f8b858c808 / CI #1117 PASS attempt 3"
          assert history_anchor in text
          text = text.replace(history_anchor, history_anchor + "\nV2.5 C7 FINAL ACCEPTANCE / PR #112 audit + PR #113 accepted merge / source 58d303db9f39b24b5883a4d408d523d5f3617279 / Local Windows S01-S16 PASS\nV2.5.0 RELEASE / PR #114 / release commit df54e10e38ee2793e8fdf285ea2c216fe8c65478 / Standard exact-main 7 of 7 PASS / annotated tag verified", 1)
          path.write_text(text, encoding="utf-8")

          # README.md — update current release pointer and add V2.5 overview/verification without deleting V2.4 history.
          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          replacements = {
              "**Video OS Studio v2.4.2 is released.**": "**Video OS Studio v2.5.0 is released.**",
              "Product version: 2.4.2": "Product version: 2.5.0",
              "Release commit: 79e48b068f701bba3f1c826710337a82f0a64760": f"Release commit: {release_commit}",
              "Release tag: v2.4.2 (annotated, verified)": "Release tag: v2.5.0 (annotated, verified)",
              "Tag object: 2c9b0ca2401f547066c6a51ff0ec60a641cfce35": f"Tag object: {tag_object}",
              "The annotated `v2.4.2` tag is the immutable current release boundary. Previous `v2.3.0`, `v2.3.1`, `v2.4.0`, and `v2.4.1` release tags remain immutable evidence and must never be moved or recreated.": "The annotated `v2.5.0` tag is the immutable current release boundary. Previous `v2.3.0`, `v2.3.1`, `v2.4.0`, `v2.4.1`, and `v2.4.2` release tags remain immutable evidence and must never be moved or recreated.",
              "[`docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md`](docs/acceptance/V2_4_2_RELEASE_FINALIZATION.md)": "[`docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md`](docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md)",
          }
          for old, new in replacements.items():
              assert old in text, old
              text = text.replace(old, new, 1)

          what_marker = "## What V2.4 adds"
          assert what_marker in text
          assert "## What V2.5 adds" not in text
          what_v25 = '''## What V2.5 adds

          V2.5 turns Video OS Studio into an Agent-native local workspace while preserving the accepted V2.4 production/runtime foundations:

          ```text
          Unified Agent Conversation
          + precise Selection / ContextReference
          + Agent | Viewer | Context | Timeline workspace
          + shared Tool Registry
          + authenticated loopback Local MCP
          + reviewable Proposal / explicit approval / revision-safe Apply
          + durable History / Job / reconnect truth
          + Mission / QA / Campaign production surfaces
          ```

          External MCP clients do not receive generic shell, filesystem, Git, process, or computer authority. Project Schema remains `2.0.0`.

          '''
          what_v25 = "\n".join(line.strip() if line.startswith("          ") else line for line in what_v25.splitlines())
          text = text.replace(what_marker, what_v25 + what_marker, 1)

          roadmap = "V2.4.2\nCorrectness / Liveness / HyperFrames Patch\n        ✅ RELEASED"
          assert roadmap in text
          text = text.replace(roadmap, roadmap + "\n\nV2.5.0\nAgent-Native Workspace + Local MCP\n        ✅ RELEASED", 1)

          verify_marker = "## V2.4.2 release verification"
          assert verify_marker in text
          assert "## V2.5.0 release verification" not in text
          verify = f'''## V2.5.0 release verification

          Accepted C7 source SHA `58d303db9f39b24b5883a4d408d523d5f3617279` passed Dedicated source acceptance, Standard 7/7 CI, and Mandatory Local Windows S01–S16. PR #113 merged the exact accepted source with expected-head protection as engineering main `79867fa26d837fb4f36dc2c60dd07c15ee88c4fd`; exact-main Dedicated run `33670276121` and Standard run `33670276165` passed.

          Release PR #114 froze exact head `3d23c55de780b8b028b0665c14d99b0cc148f4fe`. Dedicated run `33671444645` and Standard run `33671444664` passed, and expected-head merge produced release commit `{release_commit}`. Release exact-main Dedicated run `33672088362` and Standard run `33672088402` passed; Standard was 7/7 green.

          Isolated immutable-tag run `33673004195` created `v2.5.0`. Independent GitHub Git Data verification confirmed:

          ```text
          tag ref:             refs/tags/v2.5.0
          tag object type:     tag
          tag object SHA:      {tag_object}
          tag target type:     commit
          dereferenced commit: {release_commit}
          tag message:         Video OS Studio v2.5.0
          ```

          `v2.4.0`, `v2.4.1`, and `v2.4.2` were independently reverified and remain unchanged.

          '''
          verify = "\n".join(line.strip() if line.startswith("          ") else line for line in verify.splitlines())
          text = text.replace(verify_marker, verify + verify_marker, 1)
          path.write_text(text, encoding="utf-8")

          # V2.5.0 release finalization evidence — convert from pre-tag contract to immutable completion truth.
          path = Path("docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md")
          text = path.read_text(encoding="utf-8")
          assert "`V2_5_0_RELEASE = FINALIZATION IN PROGRESS`" in text
          text = text.replace("`V2_5_0_RELEASE = FINALIZATION IN PROGRESS`", "`V2_5_0_RELEASE = COMPLETE`", 1)
          old_intro = "V2.5 product engineering, C7 cloud acceptance, mandatory Local Windows S01–S16 acceptance, engineering merge, and exact-main engineering acceptance are complete. Package release metadata is synchronized to `2.5.0` on the isolated release-finalization branch. The immutable annotated `v2.5.0` tag MUST NOT be created until this release-finalization PR and the resulting exact-main release CI both pass all seven Standard CI gates."
          new_intro = "V2.5 product engineering, C7 cloud acceptance, mandatory Local Windows S01–S16 acceptance, release-finalization CI, immutable annotated tag creation, and independent Git Data verification are complete. The released package version is `2.5.0`; Project Schema remains `2.0.0`."
          assert old_intro in text
          text = text.replace(old_intro, new_intro, 1)

          gates_marker = "## Release-finalization gates still required"
          assert gates_marker in text
          g0 = text.index(gates_marker)
          completion = f'''## Release completion evidence

          Release-finalization PR #114 froze exact head:

          `3d23c55de780b8b028b0665c14d99b0cc148f4fe`

          Dedicated V2.5 Cloud Acceptance #54 / run `33671444645` passed both jobs on that exact head. Standard CI #1384 / run `33671444664` passed all seven gates. PR #114 then merged with expected-head protection as release commit:

          `{release_commit}`

          Release exact-main Dedicated V2.5 Cloud Acceptance #55 / run `33672088362` passed both jobs. Release exact-main Standard run `33672088402` completed with all seven gates passing:

          ```text
          ubuntu-verify                    PASS
          windows-verify                   PASS
          browser-smoke                    PASS
          windows-media-smoke              PASS
          windows-b6-core-acceptance       PASS
          windows-b7-campaign-acceptance   PASS
          windows-hyperframes-smoke        PASS
          ```

          Isolated tag creation run `33673004195` created `v2.5.0` only after proving `origin/main` still exactly equaled the release commit, package metadata was exactly `2.5.0`, the tag did not already exist locally or remotely, and immutable `v2.4.2` remained unchanged. The one-shot workflow then removed itself from the isolated tagging branch.

          Independent GitHub Git Data verification confirmed:

          ```text
          ref:                 refs/tags/v2.5.0
          ref object type:     tag
          tag object SHA:      {tag_object}
          tag target type:     commit
          tag target commit:   {release_commit}
          tag message:         Video OS Studio v2.5.0
          ```

          Independent re-verification also confirmed:

          ```text
          v2.4.2 tag object:   2c9b0ca2401f547066c6a51ff0ec60a641cfce35
          v2.4.2 target:       79e48b068f701bba3f1c826710337a82f0a64760
          v2.4.1 tag object:   9f3d06d8eabb114d6f1bcd907e98b4de3756a4a7
          v2.4.1 target:       4c105bad936479690711c03f3e349db36fbadaf5
          v2.4.0 tag object:   96ebdd67e2412ed4d25be36cc6120f1bba8a8734
          v2.4.0 target:       da22a5415cbf8ad2a9ce93b912b41b787b29a9b1
          ```

          ## Release contract

          ```text
          v2.5.0 tag:        v2.5.0 / annotated / verified
          release commit:    {release_commit}
          tag object:        {tag_object}
          release status:    COMPLETE
          product work:      UNFROZEN FOR A SEPARATELY APPROVED NEXT WORKSTREAM
          schema changes:    NONE
          local action:      NONE
          ```

          This docs-only release-truth sync does not create, move, or recreate the release tag. The immutable `v2.5.0` tag remains on `{release_commit}` even after `main` advances through documentation-only merge commits.
          '''
          completion = "\n".join(line.strip() if line.startswith("          ") else line for line in completion.splitlines()) + "\n"
          text = text[:g0] + completion
          path.write_text(text, encoding="utf-8")
          PY

      - name: Verify bounded docs-only diff and immutable tag
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          mapfile -t changed < <(git diff --name-only | sort)
          test "${#changed[@]}" -eq 3
          test "${changed[0]}" = "PROJECT_STATUS.md"
          test "${changed[1]}" = "README.md"
          test "${changed[2]}" = "docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md"
          test "$(node -p "require('./package.json').version")" = "2.5.0"
          test "$(node -p "require('./package-lock.json').version")" = "2.5.0"
          test "$(git rev-parse v2.5.0)" = "$TAG_OBJECT_SHA"
          test "$(git rev-parse 'v2.5.0^{}')" = "$RELEASE_COMMIT"

      - name: Commit docs truth and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/v2-5-0-release-truth-sync.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PROJECT_STATUS.md README.md docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md .github/workflows/v2-5-0-release-truth-sync.yml
          git diff --cached --check
          mapfile -t net_changed < <(git diff --cached --name-only "$RELEASE_COMMIT" | sort)
          test "${#net_changed[@]}" -eq 3
          test "${net_changed[0]}" = "PROJECT_STATUS.md"
          test "${net_changed[1]}" = "README.md"
          test "${net_changed[2]}" = "docs/acceptance/V2_5_0_RELEASE_FINALIZATION.md"
          git commit -m "docs(v2.5.0): record immutable release truth"
          git push origin HEAD:docs/v2.5.0-release-truth
