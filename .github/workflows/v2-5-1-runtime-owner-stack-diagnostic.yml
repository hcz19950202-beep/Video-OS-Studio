name: V2.5.1 Runtime Owner Stack Diagnostic

on:
  push:
    branches:
      - release/v2.5.1-mcp-correctness
    paths:
      - .github/workflows/v2-5-1-runtime-owner-stack-diagnostic.yml

jobs:
  trace-permission-center-runtime-start:
    runs-on: windows-latest
    steps:
      - name: Checkout exact diagnostic commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Instrument runtime owner claim locally only
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          p=Path("lib/runtime/runtime-owner.ts")
          s=p.read_text(encoding="utf-8")
          old='  async claimRuntimeOwner(ownerPid=process.ppid):Promise<RuntimeOwnerClaim>{\n    if(!Number.isInteger(ownerPid)||ownerPid<0)throw new Error("Runtime owner pid is invalid.");'
          new='  async claimRuntimeOwner(ownerPid=process.ppid):Promise<RuntimeOwnerClaim>{\n    console.error("RUNTIME_OWNER_CLAIM_STACK\\n"+(new Error().stack??"no-stack"));\n    if(!Number.isInteger(ownerPid)||ownerPid<0)throw new Error("Runtime owner pid is invalid.");'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1),encoding="utf-8")
          '@ | python -
      - name: Run permission-center only with isolated root
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'permission-center-stack-diagnostic'
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $env:VIDEO_OS_DATA_ROOT = Join-Path $root 'data'
          $env:TEMP = Join-Path $root 'temp'
          $env:TMP = $env:TEMP
          New-Item -ItemType Directory -Force -Path $env:VIDEO_OS_DATA_ROOT,$env:TEMP | Out-Null
          npx vitest run tests/v2-5-c5-permission-center.test.ts --pool=forks --maxWorkers=1 --minWorkers=1
          $code=$LASTEXITCODE
          $lock=Join-Path $env:VIDEO_OS_DATA_ROOT '.runtime-owner.lock'
          if(Test-Path $lock){ Write-Host 'LOCK_AFTER_TEST=YES'; Get-Content -Raw $lock } else { Write-Host 'LOCK_AFTER_TEST=NO' }
          exit $code
