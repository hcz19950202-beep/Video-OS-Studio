name: V2.4.2 One-shot H6 Format Fix

on:
  push:
    branches:
      - fix/v2.4.2-correctness-liveness
    paths:
      - .github/workflows/v2.4.2-format-fix.yml

permissions:
  contents: write

jobs:
  format-and-cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: fix/v2.4.2-correctness-liveness
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Apply repository-owned H6 formatting
        run: node scripts/h6-format.mjs --write
      - name: Remove one-shot workflow and commit
        shell: bash
        run: |
          rm .github/workflows/v2.4.2-format-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "style(v2.4.2): apply H6 formatter"
          git push origin HEAD:fix/v2.4.2-correctness-liveness
